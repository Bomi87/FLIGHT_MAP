<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Flight Route Viewer</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>

html,body{
margin:0;
padding:0;
height:100%;
width:100%;
}

#map{
height:100vh;
width:100%;
}

.panel{
position:absolute;
top:10px;
left:10px;
z-index:1000;
background:rgba(255,255,255,0.95);
padding:10px 12px;
border-radius:8px;
font-size:13px;
box-shadow:0 2px 8px rgba(0,0,0,0.2);
}

.label{
background:white;
border:1px solid #666;
padding:1px 4px;
font-size:11px;
border-radius:4px;
white-space:nowrap;
}

</style>
</head>

<body>

<div id="map"></div>

<div class="panel" id="status">
Loading route.gpx ...
</div>

<script>

const map=L.map('map').setView([42,160],3);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{maxZoom:18}
).addTo(map);

const status=document.getElementById("status");

function normalizeLon(lon){
if(lon<0)return lon+360;
return lon;
}

function parseGPX(xmlText){

const parser=new DOMParser();
const xml=parser.parseFromString(xmlText,"text/xml");

const pts=[...xml.getElementsByTagName("rtept")];

return pts.map(p=>{

const lat=parseFloat(p.getAttribute("lat"));
const lon=parseFloat(p.getAttribute("lon"));

const nameNode=p.getElementsByTagName("name")[0];

const name=nameNode?nameNode.textContent:"";

return {lat,lon,name};

});

}

const waypointLabels=[];

function updateLabels(points){

const zoom=map.getZoom();

waypointLabels.forEach(l=>map.removeLayer(l));
waypointLabels.length=0;

points.forEach((p,i)=>{

let show=false;

if(zoom<=3){
show=(i===0||i===points.length-1);
}

else if(zoom<=5){
show=(i===0||i===points.length-1||i%4===0);
}

else{
show=true;
}

if(show){

const latlng=[p.lat,normalizeLon(p.lon)];

const label=L.marker(latlng,{
interactive:false,
icon:L.divIcon({
className:"label",
html:p.name,
iconSize:null
})
}).addTo(map);

waypointLabels.push(label);

}

});

}

fetch("route.gpx?v="+Date.now())

.then(res=>{
if(!res.ok)throw new Error("route.gpx not found");
return res.text();
})

.then(text=>{

const points=parseGPX(text);

const latlngs=points.map(p=>[p.lat,normalizeLon(p.lon)]);

const route=L.polyline(latlngs,{
color:"#FFD400",
weight:5
}).addTo(map);

points.forEach((p,i)=>{

const latlng=[p.lat,normalizeLon(p.lon)];

let iconColor="yellow";

if(i===0)iconColor="green";
if(i===points.length-1)iconColor="red";

const marker=L.circleMarker(latlng,{
radius:5,
color:"#222",
weight:1,
fillColor:iconColor,
fillOpacity:1
}).addTo(map);

marker.bindPopup(p.name||"Waypoint");

});

map.fitBounds(route.getBounds(),{padding:[20,20]});

updateLabels(points);

map.on("zoomend",()=>updateLabels(points));

status.innerHTML=
"<b>Flight Route Loaded</b><br>"+
"Waypoints: "+points.length;

})

.catch(err=>{
status.innerHTML="Error: "+err.message;
});

</script>

</body>
</html>
