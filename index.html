<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <title>Flight Route Viewer</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
    }

    #map {
      height: 100vh;
      width: 100%;
    }

    .popup-body {
      font-size: 11px;
      line-height: 1.4;
      max-width: 220px;
      word-break: break-word;
    }

    .popup-title {
      font-weight: 700;
      margin-bottom: 6px;
      font-size: 13px;
    }

    .popup-section {
      margin-top: 6px;
    }

    .popup-section table {
      border-collapse: collapse;
      width: 100%;
    }

    .popup-section td {
      border-bottom: 1px solid #eee;
      padding: 3px 4px;
      vertical-align: top;
    }

    .popup-section td:first-child {
      font-weight: 600;
      white-space: nowrap;
      width: 1%;
    }

    .leaflet-popup-content {
      margin: 10px 12px;
    }

    .kml-label,
    .waypoint-label,
    .triangle-label,
    .ndb-label {
      background: transparent !important;
      border: none !important;
      box-shadow: none !important;
      padding: 0 !important;
      margin: 0 !important;
    }

    .kml-label:before,
    .waypoint-label:before,
    .triangle-label:before,
    .ndb-label:before {
      display: none !important;
    }

    .kml-label-text {
      display: inline-block;
      white-space: nowrap;
      font-weight: 700;
      text-align: left;
      transform-origin: left bottom;
      transform: translate(40px, -2px) rotate(-90deg);
      text-shadow:
        -1px -1px 0 #000,
         1px -1px 0 #000,
        -1px  1px 0 #000,
         1px  1px 0 #000,
         0 0 4px rgba(0, 0, 0, 0.65);
    }

    .waypoint-label-text {
      display: inline-block;
      white-space: nowrap;
      font-weight: 700;
      color: #ffffff;
      font-size: 10px;
      transform-origin: center center;
      text-align: left;
      text-shadow:
        -1px -1px 0 #000,
         1px -1px 0 #000,
        -1px  1px 0 #000,
         1px  1px 0 #000;
    }

    .triangle-label-text,
    .ndb-label-text {
      display: inline-block;
      white-space: nowrap;
      font-weight: 700;
      color: #ffffff;
      font-size: 10px;
      text-align: left;
      text-shadow:
        -1px -1px 0 #000,
         1px -1px 0 #000,
        -1px  1px 0 #000,
         1px  1px 0 #000,
         0 0 4px rgba(0, 0, 0, 0.65);
    }

    .leaflet-control-layers {
      font-size: 12px;
    }

    .leaflet-control-ndb-toggle {
      background: #7c3aed;
      border-radius: 4px;
      box-shadow: 0 1px 5px rgba(0,0,0,0.4);
      overflow: hidden;
    }

    .leaflet-control-ndb-toggle button {
      display: block;
      width: 100%;
      min-width: 72px;
      height: 26px;
      border: none;
      background: #7c3aed;
      color: #ffffff;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
      padding: 0 8px;
      text-align: center;
    }

    .leaflet-control-ndb-toggle button:hover {
      background: #6d28d9;
    }

    .leaflet-control-ndb-toggle button.ndb-on {
      background: #5b21b6;
      color: #ffffff;
    }

    @media (min-width: 768px) {
      .waypoint-label-text,
      .triangle-label-text,
      .ndb-label-text {
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <div id="map"></div>

  <script>
    const map = L.map("map", {
      worldCopyJump: false,
      preferCanvas: true,
      zoomControl: true
    }).setView([30, 0], 3);

    function refreshMapSize() {
      setTimeout(() => {
        map.invalidateSize();
      }, 50);
    }

    function isDesktopView() {
      return window.innerWidth >= 768;
    }

    /* -----------------------------
       Base Maps
    ----------------------------- */

    const streetMap = L.tileLayer(
      "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",
      {
        maxZoom: 18,
        attribution: "&copy; OpenStreetMap &copy; CARTO"
      }
    );

    const satelliteMap = L.tileLayer(
      "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
      {
        maxZoom: 18,
        attribution: "Tiles &copy; Esri"
      }
    );

    const satelliteWithLabels = L.layerGroup([
      L.tileLayer(
        "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
        {
          maxZoom: 18,
          attribution: "Tiles &copy; Esri"
        }
      ),
      L.tileLayer(
        "https://services.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}",
        {
          maxZoom: 18,
          attribution: "Labels &copy; Esri"
        }
      )
    ]);

    satelliteMap.addTo(map);

    const baseMaps = {
      "Street Map": streetMap,
      "Satellite": satelliteMap,
      "Satellite + Labels": satelliteWithLabels
    };

    L.control.layers(baseMaps, null, {
      position: "topright",
      collapsed: false
    }).addTo(map);

    const drawn = L.featureGroup().addTo(map);
    const acjNdbLayer = L.featureGroup();
    const routeBoundsGroup = L.featureGroup();
    const waypointZoomLabelRegistry = [];

    let ndbRawData = [];
    let ndbVisible = false;
    let ndbRedrawTimer = null;

    const POPUP_OPTIONS = {
      maxWidth: 260,
      autoPan: false
    };

    const NDB_LABEL_MIN_ZOOM = 5;
    const NDB_BOUNDS_PAD_RATIO = 0.20;
    const NDB_REDRAW_DELAY_MS = 80;

    /* -----------------------------
       영공 국가 리스트
    ----------------------------- */

    const AIRSPACE_COUNTRIES = new Set([
      "솔로몬 제도","나우루","파푸아 뉴기니","그린란드","아이슬란드","캐나다",
      "알제리","가나","아이보리 해안","나이지리아","니제르","튀니지",
      "벨기에","독일","에스토니아","핀란드","영국","네덜란드","아일랜드",
      "덴마크","노르웨이","폴란드","스웨덴","라트비아","리투아니아",
      "보츠와나","콩고 공화국","모리셔스","카메룬","잠비아","코모로",
      "마다가스카르","앙골라","가봉","모잠비크","세이셸","차드","짐바브웨",
      "말라위","콩고민주공화국","카나리아 제도","세네갈","모로코","카보베르데",
      "에티오피아","부룬디","소말리아","이집트","에리트레아","케냐","리비아",
      "르완다","수단","탄자니아","우간다",
      "미국","알바니아","불가리아","키프로스","크로아티아","스페인","프랑스",
      "그리스","헝가리","이탈리아","슬로베니아","체코 공화국","이스라엘","몰타",
      "오스트리아","포르투갈","아조레스 제도","보스니아 헤르체고비나","루마니아",
      "스위스","터키","몰도바","북 마케도니아","세르비아","슬로바키아",
      "도미니카 공화국","온두라스","자메이카","멕시코","파나마","아이티","쿠바",
      "바하마","피지","프랑스령 폴리네시아","뉴칼레도니아","뉴질랜드",
      "아프가니스탄","바레인","사우디 아라비아","이란","요르단","쿠웨이트",
      "레바논","아랍 에미리트","오만","파키스탄","이라크","시리아","예멘",
      "대만","일본","대한민국","필리핀",
      "아르헨티나","브라질","칠레","에콰도르","파라과이","콜롬비아","볼리비아",
      "수리남","프랑스령 기아나","페루","우루과이","베네수엘라","가이아나",
      "푸에르토리코","퀴라소","트리니다드토바고",
      "타지키스탄","키르기스스탄","아르메니아","러시아","조지아","우크라이나",
      "벨라루스","남수단","우즈베키스탄","스리랑카","아제르바이잔","방글라데시",
      "홍콩","라오스","네팔","몰디브","태국","미얀마","인도네시아","브루나이",
      "말레이시아","싱가포르","호주","중국","중국(산야)","북한","몽골","캄보디아",
      "베트남","인도","카자흐스탄","투르크메니스탄","나미비아","남아프리카",
      "앤티가 바부다","카타르"
    ]);

    const ALWAYS_KML_FILES = ["ACJ_NDB.kml"];

    function getRequestedFiles() {
      const params = new URLSearchParams(location.search);
      const file = params.get("file") || "";

      return file
        .split(",")
        .map(x => x.trim())
        .filter(Boolean);
    }

    function getVersionParam() {
      const params = new URLSearchParams(location.search);
      return params.get("v") || Date.now().toString();
    }

    function getExtension(filename) {
      const f = filename.toLowerCase();
      if (f.endsWith(".gpx")) return "gpx";
      if (f.endsWith(".kml")) return "kml";
      return "";
    }

    function isAlwaysKmlFile(filename) {
      return ALWAYS_KML_FILES.some(x => x.toLowerCase() === String(filename || "").toLowerCase());
    }

    function isNdbFile(filename) {
      return String(filename || "").toLowerCase() === "acj_ndb.kml";
    }

    function getTargetLayer(filename) {
      return isAlwaysKmlFile(filename) ? acjNdbLayer : drawn;
    }

    function isBadCoord(lat, lon) {
      if (!isFinite(lat) || !isFinite(lon)) return true;
      if (Math.abs(lat) > 90) return true;
      if (Math.abs(lon) > 180) return true;
      if (Math.abs(lat) < 0.000001 && Math.abs(lon) < 0.000001) return true;
      return false;
    }

    function parseXml(text) {
      return new DOMParser().parseFromString(text, "text/xml");
    }

    function addToRouteBounds(layer, sourceName) {
      if (!isNdbFile(sourceName)) {
        routeBoundsGroup.addLayer(layer);
      }
    }

    function fitAllLoadedBounds() {
      try {
        const bounds = routeBoundsGroup.getBounds();
        if (bounds && bounds.isValid && bounds.isValid()) {
          map.fitBounds(bounds, { padding: [20, 20] });
          refreshMapSize();
        }
      } catch (e) {
        console.warn(e);
      }
    }

    async function fetchTextFile(filename) {
      const version = getVersionParam();
      const url = filename + (filename.includes("?") ? "&" : "?") + "v=" + encodeURIComponent(version);

      const res = await fetch(url, { cache: "no-store" });
      if (!res.ok) throw new Error(filename + " not found");
      return await res.text();
    }

    /* -----------------------------
       공통
    ----------------------------- */

    function escapeHtml(str) {
      return String(str || "")
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function cleanLabelText(str) {
      let s = String(str || "");
      s = s.replace(/&amp;#x2F;\d+/gi, "");
      s = s.replace(/&#x2F;\d+/gi, "");
      s = s.replace(/&[#A-Za-z0-9]+;/g, "");
      return s.trim();
    }

    function buildPopupHtml(title, descriptionHtml, extraRows = []) {
      let html = `<div class="popup-body">`;

      if (title) {
        html += `<div class="popup-title">${escapeHtml(title)}</div>`;
      }

      if (descriptionHtml) {
        html += `<div class="popup-section">${descriptionHtml}</div>`;
      }

      if (extraRows && extraRows.length) {
        html += `<div class="popup-section"><table>`;
        extraRows.forEach(row => {
          html += `<tr><td>${escapeHtml(row.key)}</td><td>${row.value}</td></tr>`;
        });
        html += `</table></div>`;
      }

      html += `</div>`;
      return html;
    }

    function textOfFirst(parent, tagName) {
      const node = parent.getElementsByTagName(tagName)[0];
      return node ? node.textContent.trim() : "";
    }

    function getDirectChild(parent, tagName) {
      for (const node of parent.children || []) {
        if (node.tagName === tagName) return node;
      }
      return null;
    }

    /* -----------------------------
       KML color = aabbggrr
    ----------------------------- */

    function kmlColorToCss(kmlColor, fallbackColor, fallbackOpacity) {
      if (!kmlColor || typeof kmlColor !== "string") {
        return { color: fallbackColor, opacity: fallbackOpacity };
      }

      const s = kmlColor.trim().replace("#", "");
      if (s.length !== 8) {
        return { color: fallbackColor, opacity: fallbackOpacity };
      }

      const aa = s.substring(0, 2);
      const bb = s.substring(2, 4);
      const gg = s.substring(4, 6);
      const rr = s.substring(6, 8);

      const opacity = parseInt(aa, 16) / 255;
      const color = "#" + rr + gg + bb;

      return {
        color,
        opacity: isNaN(opacity) ? fallbackOpacity : opacity
      };
    }

    function getLabelStyle(featureStyle) {
      const base = kmlColorToCss(featureStyle?.labelColor, "#00ff00", 1);
      const scale = Number(featureStyle?.labelScale || 1);

      return {
        color: base.color || "#00ff00",
        opacity: isFinite(base.opacity) ? base.opacity : 1,
        scale: isFinite(scale) && scale > 0 ? scale : 1
      };
    }

    function getIconStyle(featureStyle) {
      const rawColor =
        featureStyle?.iconColor ||
        featureStyle?.lineColor ||
        featureStyle?.labelColor ||
        "#ffff00";

      const base = kmlColorToCss(rawColor, "#ffff00", 1);
      const scale = Number(featureStyle?.iconScale || 1);

      return {
        color: base.color || "#ffff00",
        opacity: isFinite(base.opacity) ? base.opacity : 1,
        scale: isFinite(scale) && scale > 0 ? scale : 1,
        href: featureStyle?.iconHref || ""
      };
    }

    /* -----------------------------
       Anti-Meridian helpers
    ----------------------------- */

    function wrapLon180(lon) {
      let x = Number(lon);
      if (!isFinite(x)) return lon;

      while (x <= -180) x += 360;
      while (x > 180) x -= 360;

      return x;
    }

    function shiftLonNearReference(lon, referenceLon) {
      let x = wrapLon180(lon);

      if (!isFinite(referenceLon)) return x;

      while (x - referenceLon > 180) x -= 360;
      while (x - referenceLon < -180) x += 360;

      return x;
    }

    function unwrapLonNext(prevLon, currentLon) {
      let x = wrapLon180(currentLon);

      while (x - prevLon > 180) x -= 360;
      while (x - prevLon < -180) x += 360;

      return x;
    }

    function unwrapCoordSequence(coords, referenceLon) {
      if (!Array.isArray(coords) || !coords.length) return [];

      const firstLon = shiftLonNearReference(coords[0].lon, referenceLon);
      const result = [[coords[0].lat, firstLon]];
      let prevLon = firstLon;

      for (let i = 1; i < coords.length; i++) {
        const nextLon = unwrapLonNext(prevLon, coords[i].lon);
        result.push([coords[i].lat, nextLon]);
        prevLon = nextLon;
      }

      return result;
    }

    function unwrapRingSequence(ring, referenceLon) {
      return unwrapCoordSequence(ring, referenceLon);
    }

    function average(nums) {
      if (!nums.length) return 0;
      return nums.reduce((a, b) => a + b, 0) / nums.length;
    }

    function getReferenceLonFromFeatures(features) {
      const lineFeatures = features.filter(f => f.type === "LineString" && Array.isArray(f.coords) && f.coords.length);
      if (lineFeatures.length) {
        const seq = unwrapCoordSequence(lineFeatures[0].coords, wrapLon180(lineFeatures[0].coords[0].lon));
        return average(seq.map(x => x[1]));
      }

      const polygonFeatures = features.filter(f => f.type === "Polygon" && Array.isArray(f.rings) && f.rings.length && f.rings[0].length);
      if (polygonFeatures.length) {
        const ring = unwrapRingSequence(polygonFeatures[0].rings[0], wrapLon180(polygonFeatures[0].rings[0][0].lon));
        return average(ring.map(x => x[1]));
      }

      const pointFeatures = features.filter(f => f.type === "Point" && f.coords);
      if (pointFeatures.length) {
        return wrapLon180(pointFeatures[0].coords.lon);
      }

      return 0;
    }

    function getRenderContext(features) {
      return {
        referenceLon: getReferenceLonFromFeatures(features)
      };
    }

    function toRenderLatLng(lat, lon, renderContext) {
      return [lat, shiftLonNearReference(lon, renderContext?.referenceLon)];
    }

    function toRenderLatLngsFromCoords(coords, renderContext) {
      return unwrapCoordSequence(coords, renderContext?.referenceLon);
    }

    function toRenderRings(rings, renderContext) {
      return rings.map(ring => unwrapRingSequence(ring, renderContext?.referenceLon));
    }

    window.__wrapLon180 = wrapLon180;
    window.__shiftLonNearReference = shiftLonNearReference;
    window.__ROUTE_RENDER_REFERENCE_LON = null;

    /* -----------------------------
       영공 라벨 판별
    ----------------------------- */

    function normalizeCountryName(name) {
      return String(name || "")
        .replace(/\u00A0/g, " ")
        .replace(/\s+/g, " ")
        .trim();
    }

    function extractCountryFromPlacemarkName(name) {
      const cleaned = normalizeCountryName(name);
      if (!cleaned) return "";

      const match = cleaned.match(/^(.+?)\s*\(/);
      if (match) return normalizeCountryName(match[1]);

      return cleaned;
    }

    function hasParenthesesName(name) {
      return /\(.*\)/.test(String(name || ""));
    }

    function isAirspaceLabelFeature(feature) {
      const rawName = String(feature?.name || "").trim();
      if (!rawName) return false;
      if (!hasParenthesesName(rawName)) return false;

      const country = extractCountryFromPlacemarkName(rawName);
      if (!country) return false;

      return AIRSPACE_COUNTRIES.has(country);
    }

    function getPermitStatus(feature) {
      const desc = String(feature?.description || "").toLowerCase();
      const extra = (feature?.extraRows || [])
        .map(r => `${r.key || ""} ${r.value || ""}`.toLowerCase())
        .join(" ");

      const all = `${desc} ${extra}`;

      if (all.includes("not required")) return "not_required";
      if (all.includes("required")) return "required";
      return "unknown";
    }

    function getAirspaceLabelColor(feature, fallbackColor) {
      const permit = getPermitStatus(feature);

      if (permit === "not_required") return "#00ff00";
      if (permit === "required") return "#ff0000";

      return fallbackColor || "#00ff00";
    }

    function compressConsecutiveByName(features) {
      const result = [];
      for (const f of features) {
        if (!result.length || result[result.length - 1].name !== f.name) {
          result.push(f);
        }
      }
      return result;
    }

    function getRouteEndpoints(pointFeatures) {
      const endpointCandidates = compressConsecutiveByName(
        pointFeatures.filter(f =>
          !isAirspaceLabelFeature(f) &&
          !isTriangleShapePoint(f) &&
          !isIcon52ShapePoint(f)
        )
      );

      if (endpointCandidates.length >= 2) {
        const depFeature = endpointCandidates[0];
        const destFeature = endpointCandidates[endpointCandidates.length - 1];

        return {
          departureFeature: depFeature,
          destinationFeature: destFeature,
          departureCoord: depFeature.coords,
          destinationCoord: destFeature.coords
        };
      }

      return {
        departureFeature: null,
        destinationFeature: null,
        departureCoord: null,
        destinationCoord: null
      };
    }

    function isEndpointPointFeature(feature, routeEndpoints) {
      return (
        feature === routeEndpoints?.departureFeature ||
        feature === routeEndpoints?.destinationFeature
      );
    }

    function isWaypointLabelFeature(feature) {
      if (!feature || feature.type !== "Point") return false;
      if (isAirspaceLabelFeature(feature)) return false;
      if (!feature.name || !String(feature.name).trim()) return false;
      return true;
    }

    function isIcon52ShapePoint(feature) {
      if (!feature || feature.type !== "Point") return false;
      if (isAirspaceLabelFeature(feature)) return false;

      const iconHref = String(feature?.style?.iconHref || "").toLowerCase();
      const name = String(feature?.name || "").trim();

      if (!name) return false;

      return iconHref.includes("icon52.png");
    }

    function isTriangleShapePoint(feature) {
      if (!feature || feature.type !== "Point") return false;
      if (isAirspaceLabelFeature(feature)) return false;

      const iconHref = String(feature?.style?.iconHref || "").toLowerCase();
      const name = String(feature?.name || "").trim();

      if (!name) return false;

      const triangleIcon =
        iconHref.includes("icon52.png") ||
        iconHref.includes("triangle") ||
        iconHref.includes("trk") ||
        iconHref.includes("track") ||
        iconHref.includes("placemark_triangle") ||
        iconHref.includes("shape_triangle");

      return triangleIcon;
    }

    function isAlwaysVisibleShapePointLabel(feature) {
      return isIcon52ShapePoint(feature) || isTriangleShapePoint(feature);
    }

    function bindPermanentHorizontalTriangleLabel(layer, feature) {
      if (!layer || !feature || !feature.name) return;

      const cleanedName = cleanLabelText(feature.name);
      if (!cleanedName) return;

      const labelHtml = `<span class="triangle-label-text">${escapeHtml(cleanedName)}</span>`;

      layer.bindTooltip(labelHtml, {
        permanent: true,
        direction: "right",
        offset: [8, 0],
        className: "triangle-label",
        opacity: 1
      });

      if (layer.openTooltip) {
        layer.openTooltip();
      }
    }

    function getSegmentAngleDeg(p1, p2) {
      if (!p1 || !p2) return 0;

      const dx = p2.lon - p1.lon;
      const dy = p2.lat - p1.lat;

      return Math.atan2(dy, dx) * 180 / Math.PI;
    }

    function normalizeLabelAngle(angle) {
      let a = angle;

      while (a > 180) a -= 360;
      while (a < -180) a += 360;

      if (a > 90) a -= 180;
      if (a < -90) a += 180;

      return a;
    }

    function getSmartLabelAngle(prevPoint, currPoint, nextPoint) {
      let angle = 0;

      if (prevPoint && nextPoint) {
        const a1 = getSegmentAngleDeg(prevPoint, currPoint);
        const a2 = getSegmentAngleDeg(currPoint, nextPoint);
        angle = (a1 + a2) / 2;
      } else if (prevPoint) {
        angle = getSegmentAngleDeg(prevPoint, currPoint);
      } else if (nextPoint) {
        angle = getSegmentAngleDeg(currPoint, nextPoint);
      }

      angle = normalizeLabelAngle(angle);

      const abs = Math.abs(angle);

      if (abs <= 25) return 0;
      if (abs >= 65) return -90;
      return angle > 0 ? 45 : -45;
    }

    function registerWaypointZoomLabel(layer, feature, options = {}) {
      if (!layer || !feature || !feature.name) return;
      if (!isWaypointLabelFeature(feature)) return;

      const cleanedName = cleanLabelText(feature.name);
      if (!cleanedName) return;

      const angle = Number.isFinite(options.angle) ? options.angle : 0;

      const labelHtml = `
        <span class="waypoint-label-text"
              style="transform: rotate(${angle}deg); display:inline-block;">
          ${escapeHtml(cleanedName)}
        </span>
      `;

      waypointZoomLabelRegistry.push({
        layer,
        labelHtml,
        minZoom: options.minZoom ?? 5,
        direction: options.direction || "bottom",
        offset: options.offset || [-20, 10],
        className: options.className || "waypoint-label",
        visible: false
      });
    }

    function updateWaypointZoomLabels() {
      const zoom = map.getZoom();

      waypointZoomLabelRegistry.forEach(item => {
        const shouldShow = zoom >= item.minZoom;

        if (shouldShow && !item.visible) {
          item.layer.bindTooltip(item.labelHtml, {
            permanent: true,
            direction: item.direction,
            offset: item.offset,
            className: item.className,
            opacity: 1
          });

          if (item.layer.openTooltip) {
            item.layer.openTooltip();
          }

          item.visible = true;
        } else if (!shouldShow && item.visible) {
          if (item.layer.unbindTooltip) {
            item.layer.unbindTooltip();
          }
          item.visible = false;
        }
      });
    }

    function bindNdbHorizontalLabel(layer, feature) {
      if (!layer || !feature || !feature.name) return;
      if (map.getZoom() < NDB_LABEL_MIN_ZOOM) return;

      const cleanedName = cleanLabelText(feature.name);
      if (!cleanedName) return;

      const labelHtml = `<span class="ndb-label-text">${escapeHtml(cleanedName)}</span>`;

      layer.bindTooltip(labelHtml, {
        permanent: true,
        direction: "right",
        offset: [10, 0],
        className: "ndb-label",
        opacity: 1
      });

      if (layer.openTooltip) {
        layer.openTooltip();
      }
    }

    map.on("zoomend", updateWaypointZoomLabels);

    function isLatLngInExpandedBounds(lat, lon, padRatio = 0.15) {
      const bounds = map.getBounds();
      const south = bounds.getSouth();
      const north = bounds.getNorth();
      const west = bounds.getWest();
      const east = bounds.getEast();

      const latPad = (north - south) * padRatio;
      const lonPad = (east - west) * padRatio;

      return (
        lat >= (south - latPad) &&
        lat <= (north + latPad) &&
        lon >= (west - lonPad) &&
        lon <= (east + lonPad)
      );
    }

    function parseGPX(text) {
      const xml = parseXml(text);
      const pts = [...xml.getElementsByTagName("rtept")];

      return pts.map(p => {
        const lat = parseFloat(p.getAttribute("lat"));
        const lon = parseFloat(p.getAttribute("lon"));
        const nameNode = p.getElementsByTagName("name")[0];
        const descNode = p.getElementsByTagName("desc")[0];
        const cmtNode = p.getElementsByTagName("cmt")[0];

        return {
          lat,
          lon,
          name: nameNode ? nameNode.textContent.trim() : "",
          description: descNode ? escapeHtml(descNode.textContent.trim()) : "",
          comment: cmtNode ? escapeHtml(cmtNode.textContent.trim()) : ""
        };
      }).filter(p => !isBadCoord(p.lat, p.lon));
    }

    function drawGPXRoute(points, sourceName, targetLayer) {
      if (!points || points.length < 2) {
        throw new Error("No valid route points in GPX");
      }

      const referenceLon = wrapLon180(points[0].lon);
      const renderContext = { referenceLon };

      window.__ROUTE_RENDER_REFERENCE_LON = referenceLon;

      const latlngs = [];
      let prevLon = shiftLonNearReference(points[0].lon, referenceLon);
      latlngs.push([points[0].lat, prevLon]);

      for (let i = 1; i < points.length; i++) {
        const lon = unwrapLonNext(prevLon, points[i].lon);
        latlngs.push([points[i].lat, lon]);
        prevLon = lon;
      }

      const line = L.polyline(latlngs, {
        color: "#FFD400",
        weight: 5
      }).addTo(targetLayer);

      addToRouteBounds(line, sourceName);

      points.forEach((p, i) => {
        const extraRows = [];
        if (p.comment) extraRows.push({ key: "Comment", value: p.comment });

        const popupHtml = buildPopupHtml(
          p.name || "Waypoint",
          p.description || "",
          extraRows
        );

        const latlng = toRenderLatLng(p.lat, p.lon, renderContext);

        let iconColor = "#ffff00";
        if (i === 0) iconColor = "#00aa00";
        if (i === points.length - 1) iconColor = "#0000ff";

        const marker = L.circleMarker(latlng, {
          radius: 3,
          color: "#222",
          weight: 1,
          fillColor: iconColor,
          fillOpacity: 1
        }).addTo(targetLayer);

        marker.bindPopup(popupHtml, POPUP_OPTIONS);

        const prevPoint = i > 0 ? points[i - 1] : null;
        const currPoint = points[i];
        const nextPoint = i < points.length - 1 ? points[i + 1] : null;
        const labelAngle = getSmartLabelAngle(prevPoint, currPoint, nextPoint);

        registerWaypointZoomLabel(marker, {
          type: "Point",
          name: p.name || "",
          description: p.description || ""
        }, {
          minZoom: 5,
          direction: "bottom",
          offset: [-20, 10],
          className: "waypoint-label",
          angle: labelAngle
        });

        addToRouteBounds(marker, sourceName);
      });
    }

    function parseCoordinates(coordText) {
      if (!coordText) return [];

      return coordText
        .trim()
        .split(/\s+/)
        .map(row => {
          const parts = row.split(",");
          const lon = parseFloat(parts[0]);
          const lat = parseFloat(parts[1]);
          const alt = parts.length > 2 ? parseFloat(parts[2]) : null;

          return { lat, lon, alt };
        })
        .filter(p => !isBadCoord(p.lat, p.lon));
    }

    function parseStyleNode(styleNode) {
      if (!styleNode) return {};

      const lineStyleNode = styleNode.getElementsByTagName("LineStyle")[0];
      const polyStyleNode = styleNode.getElementsByTagName("PolyStyle")[0];
      const labelStyleNode = styleNode.getElementsByTagName("LabelStyle")[0];
      const iconStyleNode = styleNode.getElementsByTagName("IconStyle")[0];

      const style = {};

      if (lineStyleNode) {
        style.lineColor = textOfFirst(lineStyleNode, "color");
        const width = parseFloat(textOfFirst(lineStyleNode, "width"));
        style.lineWidth = Number.isFinite(width) ? width : 3;
      }

      if (polyStyleNode) {
        style.polyColor = textOfFirst(polyStyleNode, "color");
        const fillText = textOfFirst(polyStyleNode, "fill");
        const outlineText = textOfFirst(polyStyleNode, "outline");
        style.fill = fillText === "" ? true : fillText !== "0";
        style.outline = outlineText === "" ? true : outlineText !== "0";
      }

      if (labelStyleNode) {
        style.labelColor = textOfFirst(labelStyleNode, "color");
        const labelScale = parseFloat(textOfFirst(labelStyleNode, "scale"));
        style.labelScale = Number.isFinite(labelScale) ? labelScale : 1;
      }

      if (iconStyleNode) {
        style.iconColor = textOfFirst(iconStyleNode, "color");
        const iconScale = parseFloat(textOfFirst(iconStyleNode, "scale"));
        style.iconScale = Number.isFinite(iconScale) ? iconScale : 1;

        const iconNode = iconStyleNode.getElementsByTagName("Icon")[0];
        if (iconNode) {
          style.iconHref = textOfFirst(iconNode, "href");
        }
      }

      return style;
    }

    function mergeStyles(baseStyle, overrideStyle) {
      return {
        ...(baseStyle || {}),
        ...(overrideStyle || {})
      };
    }

    function buildStyleIndex(xml) {
      const styleMap = {};
      const styleNodes = [...xml.getElementsByTagName("Style")];

      styleNodes.forEach(styleNode => {
        const id = styleNode.getAttribute("id");
        if (!id) return;
        styleMap["#" + id] = parseStyleNode(styleNode);
      });

      return styleMap;
    }

    function buildStyleMapIndex(xml) {
      const styleMapIndex = {};
      const styleMapNodes = [...xml.getElementsByTagName("StyleMap")];

      styleMapNodes.forEach(node => {
        const id = node.getAttribute("id");
        if (!id) return;

        const pairs = [...node.getElementsByTagName("Pair")];
        let normalUrl = "";

        pairs.forEach(pair => {
          const key = textOfFirst(pair, "key");
          const styleUrl = textOfFirst(pair, "styleUrl");
          if (key === "normal" && styleUrl) {
            normalUrl = styleUrl;
          }
        });

        if (normalUrl) {
          styleMapIndex["#" + id] = normalUrl;
        }
      });

      return styleMapIndex;
    }

    function buildExtendedDataRows(placemark) {
      const rows = [];

      const simpleDatas = placemark.getElementsByTagName("SimpleData");
      [...simpleDatas].forEach(node => {
        const key = node.getAttribute("name") || "Data";
        const value = escapeHtml(node.textContent || "");
        if (value) rows.push({ key, value });
      });

      const datas = placemark.getElementsByTagName("Data");
      [...datas].forEach(node => {
        const key = node.getAttribute("name") || "Data";
        const valueNode = node.getElementsByTagName("value")[0];
        const value = valueNode ? escapeHtml(valueNode.textContent || "") : "";
        if (value) rows.push({ key, value });
      });

      return rows;
    }

    function extractKMLFeatures(text) {
      const xml = parseXml(text);
      const styleIndex = buildStyleIndex(xml);
      const styleMapIndex = buildStyleMapIndex(xml);
      const placemarks = [...xml.getElementsByTagName("Placemark")];

      const features = [];

      placemarks.forEach(pm => {
        const name = textOfFirst(pm, "name");
        const description = textOfFirst(pm, "description");

        let styleUrl = textOfFirst(pm, "styleUrl");
        if (styleMapIndex[styleUrl]) {
          styleUrl = styleMapIndex[styleUrl];
        }

        const sharedStyle = styleIndex[styleUrl] || {};
        const inlineStyleNode = getDirectChild(pm, "Style");
        const inlineStyle = parseStyleNode(inlineStyleNode);
        const style = mergeStyles(sharedStyle, inlineStyle);

        const extraRows = buildExtendedDataRows(pm);

        const pointNodes = pm.getElementsByTagName("Point");
        const lineNodes = pm.getElementsByTagName("LineString");
        const polyNodes = pm.getElementsByTagName("Polygon");

        [...pointNodes].forEach(node => {
          const coords = parseCoordinates(textOfFirst(node, "coordinates"));
          if (coords.length) {
            features.push({
              type: "Point",
              name,
              description,
              extraRows,
              style,
              coords: coords[0]
            });
          }
        });

        [...lineNodes].forEach(node => {
          const coords = parseCoordinates(textOfFirst(node, "coordinates"));
          if (coords.length >= 2) {
            features.push({
              type: "LineString",
              name,
              description,
              extraRows,
              style,
              coords
            });
          }
        });

        [...polyNodes].forEach(node => {
          const rings = [];

          const outerNodes = [...node.getElementsByTagName("outerBoundaryIs")];
          outerNodes.forEach(outer => {
            const outerCoords = parseCoordinates(textOfFirst(outer, "coordinates"));
            if (outerCoords.length >= 3) rings.push(outerCoords);
          });

          const innerNodes = [...node.getElementsByTagName("innerBoundaryIs")];
          innerNodes.forEach(inner => {
            const innerCoords = parseCoordinates(textOfFirst(inner, "coordinates"));
            if (innerCoords.length >= 3) rings.push(innerCoords);
          });

          if (rings.length) {
            features.push({
              type: "Polygon",
              name,
              description,
              extraRows,
              style,
              rings
            });
          }
        });
      });

      return features;
    }

    function addPointMarkerInstance(latlng, feature, targetLayer, sourceName, popupHtml, options = {}) {
      const labelStyle = getLabelStyle(feature.style);
      const iconStyle = getIconStyle(feature.style);
      const isAirspaceLabel = isAirspaceLabelFeature(feature);
      const skipRouteBounds = !!options.skipRouteBounds;
      const skipNdbLabel = !!options.skipNdbLabel;

      if (isAirspaceLabel) {
        const cleanedName = cleanLabelText(feature.name);
        if (!cleanedName) return;

        const labelColor = getAirspaceLabelColor(feature, labelStyle.color);
        const fontSize = isDesktopView()
          ? Math.max(10, Math.round(13 * labelStyle.scale))
          : Math.max(7, Math.round(9 * labelStyle.scale));

        const labelHtml =
          `<span class="kml-label-text" style="color:${labelColor}; opacity:${labelStyle.opacity}; font-size:${fontSize}px;">${escapeHtml(cleanedName)}</span>`;

        const labelOnlyMarker = L.marker(latlng, {
          opacity: 0,
          keyboard: false
        }).addTo(targetLayer);

        if (popupHtml) {
          labelOnlyMarker.bindPopup(popupHtml, POPUP_OPTIONS);
        }

        labelOnlyMarker.bindTooltip(labelHtml, {
          permanent: true,
          direction: "top",
          offset: [0, 0],
          className: "kml-label",
          opacity: 1
        });

        if (!skipRouteBounds) addToRouteBounds(labelOnlyMarker, sourceName);
        return;
      }

      if (iconStyle.href) {
        const iconSize = isDesktopView()
          ? Math.max(12, Math.round(14 * iconStyle.scale))
          : Math.max(8, Math.round(9 * iconStyle.scale));

        const customIcon = L.icon({
          iconUrl: iconStyle.href,
          iconSize: [iconSize, iconSize],
          iconAnchor: [iconSize / 2, iconSize / 2],
          popupAnchor: [0, -12]
        });

        const marker = L.marker(latlng, {
          icon: customIcon,
          zIndexOffset: 2000
        }).addTo(targetLayer);

        if (popupHtml) {
          marker.bindPopup(popupHtml, POPUP_OPTIONS);
        }

        if (isTriangleShapePoint(feature)) {
          bindPermanentHorizontalTriangleLabel(marker, feature);
        } else if (isIcon52ShapePoint(feature)) {
          bindPermanentHorizontalTriangleLabel(marker, feature);
        } else if (isNdbFile(sourceName)) {
          if (!skipNdbLabel) {
            bindNdbHorizontalLabel(marker, feature);
          }
        } else {
          registerWaypointZoomLabel(marker, feature, {
            minZoom: 5,
            direction: "bottom",
            offset: [-20, 10],
            className: "waypoint-label",
            angle: options.labelAngle ?? 0
          });
        }

        if (!skipRouteBounds) addToRouteBounds(marker, sourceName);
        return;
      }

      const markerColor = iconStyle.color || "#ffff00";
      const markerOpacity = iconStyle.opacity || 1;
      const markerRadius = Math.max(4, 4 * iconStyle.scale);

      const marker = L.circleMarker(latlng, {
        radius: markerRadius,
        color: "#222",
        weight: 1,
        fillColor: markerColor,
        fillOpacity: markerOpacity
      }).addTo(targetLayer);

      if (popupHtml) {
        marker.bindPopup(popupHtml, POPUP_OPTIONS);
      }

      if (isAlwaysVisibleShapePointLabel(feature)) {
        bindPermanentHorizontalTriangleLabel(marker, feature);
      } else if (isNdbFile(sourceName)) {
        if (!skipNdbLabel) {
          bindNdbHorizontalLabel(marker, feature);
        }
      } else {
        registerWaypointZoomLabel(marker, feature, {
          minZoom: 5,
          direction: "bottom",
          offset: [-20, 10],
          className: "waypoint-label",
          angle: options.labelAngle ?? 0
        });
      }

      if (!skipRouteBounds) addToRouteBounds(marker, sourceName);
    }

    function getNearestWorldCopyLon(lon) {
      const centerLon = map.getCenter().lng;
      const options = [lon - 360, lon, lon + 360];

      let bestLon = options[0];
      let minDiff = Math.abs(centerLon - bestLon);

      for (let i = 1; i < options.length; i++) {
        const diff = Math.abs(centerLon - options[i]);
        if (diff < minDiff) {
          minDiff = diff;
          bestLon = options[i];
        }
      }

      return bestLon;
    }

    function redrawNDB() {
      acjNdbLayer.clearLayers();

      if (!ndbVisible || !ndbRawData.length) return;

      const zoom = map.getZoom();

      ndbRawData.forEach(feature => {
        const refLon = Number.isFinite(window.__ROUTE_RENDER_REFERENCE_LON)
          ? window.__ROUTE_RENDER_REFERENCE_LON
          : map.getCenter().lng;

        const bestLon = shiftLonNearReference(feature.coords.lon, refLon);
        const latlng = [feature.coords.lat, bestLon];

        if (!isLatLngInExpandedBounds(latlng[0], latlng[1], NDB_BOUNDS_PAD_RATIO)) {
          return;
        }

        const popupHtml = buildPopupHtml(
          feature.name || "NDB",
          feature.description || "",
          feature.extraRows || []
        );

        addPointMarkerInstance(
          latlng,
          feature,
          acjNdbLayer,
          "ACJ_NDB.kml",
          popupHtml,
          {
            skipRouteBounds: true,
            skipNdbLabel: zoom < NDB_LABEL_MIN_ZOOM
          }
        );
      });
    }

    function scheduleRedrawNDB() {
      if (!ndbVisible) return;

      clearTimeout(ndbRedrawTimer);
      ndbRedrawTimer = setTimeout(() => {
        redrawNDB();
      }, NDB_REDRAW_DELAY_MS);
    }

    function drawKMLPoint(feature, targetLayer, sourceName, renderContext, options = {}) {
      const popupHtml = buildPopupHtml(
        feature.name || "Waypoint",
        feature.description || "",
        feature.extraRows || []
      );

      const latlng = toRenderLatLng(feature.coords.lat, feature.coords.lon, renderContext);

      addPointMarkerInstance(
        latlng,
        feature,
        targetLayer,
        sourceName,
        popupHtml,
        options
      );
    }

    function drawKMLLine(feature, targetLayer, sourceName, renderContext) {
      const lineStyle = kmlColorToCss(feature.style.lineColor, "#FFD400", 1);
      const weight = feature.style.lineWidth || 4;

      const latlngs = toRenderLatLngsFromCoords(feature.coords, renderContext);

      const line = L.polyline(latlngs, {
        color: lineStyle.color,
        weight: weight,
        opacity: lineStyle.opacity
      }).addTo(targetLayer);

      if (feature.name || feature.description || (feature.extraRows && feature.extraRows.length)) {
        const popupHtml = buildPopupHtml(
          feature.name || "LineString",
          feature.description || "",
          feature.extraRows || []
        );
        line.bindPopup(popupHtml, POPUP_OPTIONS);
      }

      addToRouteBounds(line, sourceName);
    }

    function drawKMLPolygon(feature, targetLayer, sourceName, renderContext) {
      const lineStyle = kmlColorToCss(feature.style.lineColor, "#00aa55", 0.9);
      const fillStyle = kmlColorToCss(feature.style.polyColor, "#00CC66", 0.3);

      const rings = toRenderRings(feature.rings, renderContext);

      const polygon = L.polygon(rings, {
        color: lineStyle.color,
        opacity: feature.style.outline === false ? 0 : lineStyle.opacity,
        weight: feature.style.outline === false ? 0 : (feature.style.lineWidth || 2),
        fillColor: fillStyle.color,
        fillOpacity: feature.style.fill === false ? 0 : fillStyle.opacity
      }).addTo(targetLayer);

      if (feature.name || feature.description || (feature.extraRows && feature.extraRows.length)) {
        const popupHtml = buildPopupHtml(
          feature.name || "Polygon",
          feature.description || "",
          feature.extraRows || []
        );
        polygon.bindPopup(popupHtml, POPUP_OPTIONS);
      }

      addToRouteBounds(polygon, sourceName);
    }

    function drawRouteEndpointMarkers(routeEndpoints, targetLayer, sourceName, renderContext) {
      if (!routeEndpoints) return;

      const depFeature = routeEndpoints.departureFeature;
      const destFeature = routeEndpoints.destinationFeature;

      if (depFeature?.coords) {
        const depLatLng = toRenderLatLng(depFeature.coords.lat, depFeature.coords.lon, renderContext);

        const departureIcon = L.icon({
          iconUrl: "https://maps.google.com/mapfiles/kml/paddle/grn-circle.png",
          iconSize: [22, 22],
          iconAnchor: [11, 11],
          popupAnchor: [0, -10]
        });

        const depMarker = L.marker(depLatLng, {
          icon: departureIcon,
          zIndexOffset: 1000
        }).addTo(targetLayer);

        depMarker.bindPopup(
          buildPopupHtml(
            depFeature.name || "",
            depFeature.description || "",
            depFeature.extraRows || []
          ),
          POPUP_OPTIONS
        );

        addToRouteBounds(depMarker, sourceName);
      }

      if (destFeature?.coords) {
        const destLatLng = toRenderLatLng(destFeature.coords.lat, destFeature.coords.lon, renderContext);

        const destinationIcon = L.icon({
          iconUrl: "https://maps.google.com/mapfiles/kml/paddle/blu-circle.png",
          iconSize: [22, 22],
          iconAnchor: [11, 11],
          popupAnchor: [0, -10]
        });

        const destMarker = L.marker(destLatLng, {
          icon: destinationIcon,
          zIndexOffset: 1000
        }).addTo(targetLayer);

        destMarker.bindPopup(
          buildPopupHtml(
            destFeature.name || "",
            destFeature.description || "",
            destFeature.extraRows || []
          ),
          POPUP_OPTIONS
        );

        addToRouteBounds(destMarker, sourceName);
      }
    }

    function drawKMLFeatures(features, sourceName, targetLayer) {
      if (!features.length) {
        throw new Error("No valid features in KML");
      }

      if (isNdbFile(sourceName)) {
        ndbRawData = features.filter(f => f.type === "Point");
        scheduleRedrawNDB();
        return;
      }

      const renderContext = getRenderContext(features);

      window.__ROUTE_RENDER_REFERENCE_LON = renderContext.referenceLon;

      const pointFeatures = features.filter(f => f.type === "Point");
      const lineFeatures = features.filter(f => f.type === "LineString");
      const polygonFeatures = features.filter(f => f.type === "Polygon");
      const routeEndpoints = getRouteEndpoints(pointFeatures);

      const waypointOnlyPoints = pointFeatures.filter(f =>
        !isAirspaceLabelFeature(f) &&
        !isTriangleShapePoint(f) &&
        !isIcon52ShapePoint(f) &&
        !isEndpointPointFeature(f, routeEndpoints)
      );

      lineFeatures.forEach(f => drawKMLLine(f, targetLayer, sourceName, renderContext));
      polygonFeatures.forEach(f => drawKMLPolygon(f, targetLayer, sourceName, renderContext));

      let lastAirspaceLabelName = "";

      pointFeatures.forEach(f => {
        if (isEndpointPointFeature(f, routeEndpoints)) {
          return;
        }

        if (isAirspaceLabelFeature(f)) {
          const currentName = String(f.name || "").trim();

          if (currentName && currentName === lastAirspaceLabelName) {
            return;
          }

          lastAirspaceLabelName = currentName;

          drawKMLPoint(f, targetLayer, sourceName, renderContext, {
            labelAngle: 0
          });
          return;
        }

        lastAirspaceLabelName = "";

        let labelAngle = 0;

        const idx = waypointOnlyPoints.indexOf(f);
        if (idx >= 0) {
          const prevPoint = idx > 0 ? waypointOnlyPoints[idx - 1].coords : null;
          const currPoint = waypointOnlyPoints[idx].coords;
          const nextPoint = idx < waypointOnlyPoints.length - 1 ? waypointOnlyPoints[idx + 1].coords : null;

          labelAngle = getSmartLabelAngle(prevPoint, currPoint, nextPoint);
        }

        drawKMLPoint(f, targetLayer, sourceName, renderContext, {
          labelAngle
        });
      });

      drawRouteEndpointMarkers(routeEndpoints, targetLayer, sourceName, renderContext);
    }

    function createNdbToggleControl() {
      const control = L.control({ position: "topright" });

      control.onAdd = function () {
        const container = L.DomUtil.create("div", "leaflet-bar leaflet-control leaflet-control-ndb-toggle");
        const button = L.DomUtil.create("button", "", container);

        function updateButton() {
          button.textContent = ndbVisible ? "NDB ON" : "NDB OFF";
          button.className = ndbVisible ? "ndb-on" : "";
        }

        button.type = "button";
        updateButton();

        L.DomEvent.disableClickPropagation(container);
        L.DomEvent.disableScrollPropagation(container);

        L.DomEvent.on(button, "click", function (e) {
          L.DomEvent.stop(e);

          ndbVisible = !ndbVisible;

          if (ndbVisible) {
            if (!map.hasLayer(acjNdbLayer)) {
              map.addLayer(acjNdbLayer);
            }
            scheduleRedrawNDB();
          } else {
            clearTimeout(ndbRedrawTimer);
            acjNdbLayer.clearLayers();
            if (map.hasLayer(acjNdbLayer)) {
              map.removeLayer(acjNdbLayer);
            }
          }

          updateButton();
        });

        return container;
      };

      return control;
    }

    createNdbToggleControl().addTo(map);

    async function loadByFilename(filename) {
      const ext = getExtension(filename);
      if (!ext) {
        throw new Error("Only .gpx or .kml supported");
      }

      const targetLayer = getTargetLayer(filename);
      const text = await fetchTextFile(filename);

      if (ext === "gpx") {
        const points = parseGPX(text);
        drawGPXRoute(points, filename, targetLayer);
        return;
      }

      if (ext === "kml") {
        const features = extractKMLFeatures(text);
        drawKMLFeatures(features, filename, targetLayer);
        return;
      }
    }

    async function autoLoadDefault() {
      try {
        await loadByFilename("route.gpx");
        return;
      } catch (e1) {
        try {
          await loadByFilename("route.kml");
          return;
        } catch (e2) {
          throw new Error("No default route.gpx or route.kml found");
        }
      }
    }

    async function init() {
      try {
        const requestedFiles = getRequestedFiles();

        const filesToLoad = [
          ...ALWAYS_KML_FILES,
          ...requestedFiles
        ];

        if (filesToLoad.length > 0) {
          for (const file of [...new Set(filesToLoad)]) {
            await loadByFilename(file);
          }
        } else {
          await autoLoadDefault();
        }

        updateWaypointZoomLabels();
        fitAllLoadedBounds();
        refreshMapSize();

      } catch (err) {
        console.error(err);
        alert("Error: " + (err.message || err));
      }
    }

    window.addEventListener("resize", () => {
      refreshMapSize();
      updateWaypointZoomLabels();
      scheduleRedrawNDB();
    });

    window.addEventListener("load", refreshMapSize);
    window.addEventListener("pageshow", refreshMapSize);

    map.on("moveend zoomend", function () {
      scheduleRedrawNDB();
    });

    init();
  </script>

  <script src="aircraft.js?v=9"></script>
</body>
