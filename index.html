function getFirRenderReferenceLon() {
  return GLOBAL_WORLD_REFERENCE_LON;
}
function removeActiveFirCenterLabel() {
  if (activeFirCenterLabel && firLayer.hasLayer(activeFirCenterLabel)) {
    firLayer.removeLayer(activeFirCenterLabel);
  }
  activeFirCenterLabel = null;
}

function getFirCenterLatLng(feature, referenceLon) {
  const props = feature.properties || {};

  const centlat = Number(props.centlat ?? props.CENTLAT);
  const centlong = Number(props.centlong ?? props.CENTLONG);

  if (Number.isFinite(centlat) && Number.isFinite(centlong)) {
    return [
      centlat,
      shiftLonNearReference(centlong, referenceLon)
    ];
  }

  const rings = extractFirRingsFromGeometry(feature.geometry);
  const points = [];

  rings.forEach(ring => {
    (ring || []).forEach(pt => {
      if (!isGeoJsonCoordPair(pt)) return;

      const lon = shiftLonNearReference(Number(pt[0]), referenceLon);
      const lat = Number(pt[1]);

      if (Number.isFinite(lat) && Number.isFinite(lon)) {
        points.push([lat, lon]);
      }
    });
  });

  if (!points.length) return map.getCenter();

  const avgLat = points.reduce((sum, p) => sum + p[0], 0) / points.length;
  const avgLon = points.reduce((sum, p) => sum + p[1], 0) / points.length;

  return [avgLat, avgLon];
}

function showFirCenterLabel(feature, referenceLon) {
  removeActiveFirCenterLabel();

  const firLabel = getFirLabel(feature);
  const centerLatLng = getFirCenterLatLng(feature, referenceLon);

  const icon = L.divIcon({
    className: "fir-center-label",
    html: `<div class="fir-center-label-text">${escapeHtml(firLabel)}</div>`,
    iconSize: null
  });

  activeFirCenterLabel = L.marker(centerLatLng, {
    icon,
    interactive: false,
    keyboard: false,
    zIndexOffset: 5000
  }).addTo(firLayer);
}
function getFirGeometryReferenceLon(geom) {
  try {
    if (!geom || !geom.coordinates) return 0;

    const values = [];

    function collectLon(arr) {
      if (!Array.isArray(arr)) return;

      if (
        arr.length >= 2 &&
        typeof arr[0] === "number" &&
        typeof arr[1] === "number"
      ) {
        values.push(arr[0]);
        return;
      }

      arr.forEach(collectLon);
    }

    collectLon(geom.coordinates);

    if (!values.length) return 0;

    return values.reduce((a, b) => a + b, 0) / values.length;
  } catch (e) {
    return 0;
  }
}
function isGeoJsonCoordPair(coords) {
  return (
    Array.isArray(coords) &&
    coords.length >= 2 &&
    typeof coords[0] === "number" &&
    typeof coords[1] === "number"
  );
}

function extractFirRingsFromGeometry(geometry) {
  if (!geometry || !geometry.coordinates) return [];

  if (geometry.type === "Polygon") {
    return geometry.coordinates || [];
  }

  if (geometry.type === "MultiPolygon") {
    const rings = [];
    (geometry.coordinates || []).forEach(poly => {
      (poly || []).forEach(ring => rings.push(ring));
    });
    return rings;
  }

  return [];
}

function normalizeFirRingToSegments(ring, referenceLon) {
  if (!Array.isArray(ring) || ring.length < 2) return [];

  const segments = [];
  let current = [];
  let prev = null;

  for (let i = 0; i < ring.length; i++) {
    const raw = ring[i];
    if (!isGeoJsonCoordPair(raw)) continue;

    const rawLon = Number(raw[0]);
    const lat = Number(raw[1]);

    if (!Number.isFinite(rawLon) || !Number.isFinite(lat)) continue;

    let lon;

    if (!prev) {
      lon = shiftLonNearReference(rawLon, referenceLon);
      current.push([lat, lon]);
      prev = { rawLon, lon, lat };
      continue;
    }

    lon = rawLon;

    while (lon - prev.lon > 180) lon -= 360;
    while (lon - prev.lon < -180) lon += 360;

    const rawJump = Math.abs(rawLon - prev.rawLon);
    const renderedJump = Math.abs(lon - prev.lon);
    const verticalSeam =
      Math.abs(lon - prev.lon) < 0.3 &&
      Math.abs(lat - prev.lat) > 70;

    if (rawJump > 170 || renderedJump > 170 || verticalSeam) {
      if (current.length >= 2) segments.push(current);
      current = [[lat, lon]];
    } else {
      current.push([lat, lon]);
    }

    prev = { rawLon, lon, lat };
  }

  if (current.length >= 2) segments.push(current);
  return segments;
}

function normalizeFirRingToPolygon(ring, referenceLon) {
  if (!Array.isArray(ring) || ring.length < 3) return [];

  const result = [];
  let prevLon = null;

  for (let i = 0; i < ring.length; i++) {
    const raw = ring[i];
    if (!isGeoJsonCoordPair(raw)) continue;

    const rawLon = Number(raw[0]);
    const lat = Number(raw[1]);

    if (!Number.isFinite(rawLon) || !Number.isFinite(lat)) continue;

    let lon;

    if (prevLon === null) {
      lon = shiftLonNearReference(rawLon, referenceLon);
    } else {
      lon = rawLon;
      while (lon - prevLon > 180) lon -= 360;
      while (lon - prevLon < -180) lon += 360;
    }

    result.push([lat, lon]);
    prevLon = lon;
  }

  return result.length >= 3 ? result : [];
}

function addFirHitPolygon(feature, referenceLon) {
  const rings = extractFirRingsFromGeometry(feature.geometry);
  if (!rings.length) return;

  const polygonRings = [];

  rings.forEach(ring => {
    const normalizedRing = normalizeFirRingToPolygon(ring, referenceLon);
    if (normalizedRing.length >= 3) {
      polygonRings.push(normalizedRing);
    }
  });

  if (!polygonRings.length) return;

  const hitPolygon = L.polygon(polygonRings, getFirHitPolygonStyle());

  bindFirTooltipAndHover(hitPolygon, feature, {
    isHitPolygon: true,
    referenceLon
  });

  hitPolygon.addTo(firLayer);
}
    
function bindFirTooltipAndHover(layer, feature, options = {}) {
  const isHitPolygon = !!options.isHitPolygon;
  const referenceLon = Number.isFinite(options.referenceLon)
    ? options.referenceLon
    : getFirRenderReferenceLon();

  layer.on("mouseover", function () {
    if (layer.setStyle) {
      if (isHitPolygon) {
        layer.setStyle(getFirHitPolygonHoverStyle());
      } else {
        layer.setStyle(getFirHoverStyle());
      }
    }

    showFirCenterLabel(feature, referenceLon);
  });

  layer.on("mouseout", function () {
    if (layer.setStyle) {
      if (isHitPolygon) {
        layer.setStyle(getFirHitPolygonStyle());
      } else {
        const s = getFirStyle();
        layer.setStyle({
          color: s.color,
          weight: s.weight,
          opacity: s.opacity
        });
      }
    }

    removeActiveFirCenterLabel();
  });
}

function drawFirFeature(feature, referenceLon) {
  const rings = extractFirRingsFromGeometry(feature.geometry);
  if (!rings.length) return;

  const baseStyle = getFirStyle();

  // 1) 내부 마우스 hover 감지용 투명 polygon
  addFirHitPolygon(feature, referenceLon);

  // 2) 실제 화면에 보이는 FIR boundary line
  rings.forEach(ring => {
    const segments = normalizeFirRingToSegments(ring, referenceLon);

    segments.forEach(segment => {
      if (!segment || segment.length < 2) return;

      const layer = L.polyline(segment, {
        color: baseStyle.color,
        weight: baseStyle.weight,
        opacity: baseStyle.opacity,
        interactive: true
      });

     bindFirTooltipAndHover(layer, feature, {
  referenceLon
});
      layer.addTo(firLayer);
    });
  });
}
async function loadFirGeojson() {
  if (firLoaded) return;

  const res = await fetchStaticFileOncePerDay("world_fir.geojson");

  if (!res.ok) {
    throw new Error("world_fir.geojson load failed: " + res.status);
  }

  const data = await res.json();
  const referenceLon = getFirRenderReferenceLon();

  firLayer.clearLayers();

  if (!data || !Array.isArray(data.features)) {
    throw new Error("world_fir.geojson is not valid GeoJSON FeatureCollection");
  }

  data.features.forEach(feature => drawFirFeature(feature, referenceLon));

  firGeoJsonLayer = firLayer;
  firLoaded = true;
}
/*******************************************************
 * U.S ARTCC Layer helpers
 * - artcc.geojson 사용
 * - properties.ident / facility / name 사용
 *******************************************************/
function getArtccCode(props) {
  const candidates = [
    props.ident,
    props.IDENT,
    props.facility,
    props.FACILITY,
    props.id,
    props.ID,
    props.code,
    props.CODE,
    props.artcc,
    props.ARTCC,
    props.name,
    props.NAME
  ];

  for (const v of candidates) {
    if (v === undefined || v === null) continue;

    const text = String(v).trim().toUpperCase();

    const match = text.match(/\bZ[A-Z]{2}\b/);
    if (match) return match[0];

    if (/^Z[A-Z]{2}$/.test(text)) return text;
  }

  return "";
}

function getArtccLabel(feature) {
  const props = feature.properties || {};
  const code = getArtccCode(props);
  return code || "";
}

function getArtccStyle() {
  return {
    color: "#f97316",
    weight: 2.2,
    opacity: 0.95,
    fillColor: "#f97316",
    fillOpacity: 0.13
  };
}

function getArtccHoverStyle() {
  return {
    color: "#ef4444",
    weight: 3,
    opacity: 1,
    fillColor: "#ef4444",
    fillOpacity: 0.18
  };
}

function getGeoJsonRings(geometry) {
  if (!geometry || !geometry.coordinates) return [];

  if (geometry.type === "Polygon") {
    return geometry.coordinates || [];
  }

  if (geometry.type === "MultiPolygon") {
    const rings = [];
    (geometry.coordinates || []).forEach(poly => {
      (poly || []).forEach(ring => rings.push(ring));
    });
    return rings;
  }

  return [];
}


    
function normalizeGeoJsonRingToLatLng(ring, referenceLon) {
  if (!Array.isArray(ring) || ring.length < 3) return [];

  return ring
    .filter(pt => Array.isArray(pt) && pt.length >= 2)
    .map(pt => {
      const lat = Number(pt[1]);
      const lon = shiftLonNearReference(Number(pt[0]), referenceLon);
      return [lat, lon];
    })
    .filter(pt =>
      Number.isFinite(pt[0]) &&
      Number.isFinite(pt[1]) &&
      Math.abs(pt[0]) <= 90
    );
}

function getArtccCenterLatLng(feature, referenceLon) {
  const props = feature.properties || {};

  const latCandidates = [
    props.centlat,
    props.CENTLAT,
    props.lat,
    props.LAT
  ];

  const lonCandidates = [
    props.centlong,
    props.CENTLONG,
    props.lon,
    props.LON,
    props.lng,
    props.LNG
  ];

  for (let i = 0; i < latCandidates.length; i++) {
    const lat = Number(latCandidates[i]);
    const lonRaw = Number(lonCandidates[i]);

    if (Number.isFinite(lat) && Number.isFinite(lonRaw)) {
      return [lat, shiftLonNearReference(lonRaw, referenceLon)];
    }
  }

  const rings = getGeoJsonRings(feature.geometry);
  const points = [];

  rings.forEach(ring => {
    const latlngs = normalizeGeoJsonRingToLatLng(ring, referenceLon);
    latlngs.forEach(p => points.push(p));
  });

  if (!points.length) return null;

  const avgLat = points.reduce((sum, p) => sum + p[0], 0) / points.length;
  const avgLon = points.reduce((sum, p) => sum + p[1], 0) / points.length;

  return [avgLat, avgLon];
}

function addArtccLabel(feature, referenceLon) {
  const center = getArtccCenterLatLng(feature, referenceLon);
  if (!center) return;

  const label = getArtccLabel(feature);
  if (!label) return;

  const icon = L.divIcon({
    className: "artcc-label",
    html: `<span class="artcc-label-text">${escapeHtml(label)}</span>`,
    iconSize: null
  });

  L.marker(center, {
    icon,
    interactive: false,
    keyboard: false,
    zIndexOffset: 4500
  }).addTo(artccLayer);
}

function drawArtccFeature(feature, referenceLon) {
  const rings = getGeoJsonRings(feature.geometry);
  if (!rings.length) return;

  const polygonRings = [];

  rings.forEach(ring => {
    const latlngs = normalizeGeoJsonRingToLatLng(ring, referenceLon);
    if (latlngs.length >= 3) {
      polygonRings.push(latlngs);
    }
  });

  if (!polygonRings.length) return;

  const polygon = L.polygon(polygonRings, {
    ...getArtccStyle(),
    interactive: true
  }).addTo(artccLayer);

  polygon.on("mouseover", function () {
    polygon.setStyle(getArtccHoverStyle());
  });

  polygon.on("mouseout", function () {
    polygon.setStyle(getArtccStyle());
  });

  addArtccLabel(feature, referenceLon);
}
async function loadArtccGeojson() {
  if (artccLoaded) return;

  const res = await fetchStaticFileOncePerDay("artcc.geojson");

  if (!res.ok) {
    throw new Error("artcc.geojson load failed: " + res.status);
  }

  const data = await res.json();

  if (!data || !Array.isArray(data.features)) {
    throw new Error("artcc.geojson is not valid GeoJSON FeatureCollection");
  }

  const referenceLon = getArtccRenderReferenceLon();

  artccLayer.clearLayers();

  data.features.forEach(feature => {
    drawArtccFeature(feature, referenceLon);
  });

  artccLoaded = true;
}
function getArtccRenderReferenceLon() {
  return GLOBAL_WORLD_REFERENCE_LON;
}

/* =========================================================
 * openAIP 제한/위험/금지/군 공역 검색
 * ========================================================= */
function createAirspaceSearchControl() {
  const control = L.control({ position: "bottomright" });

  control.onAdd = function () {
    const container = L.DomUtil.create(
      "div",
      "leaflet-control leaflet-control-airspace-search"
    );

    container.innerHTML = `
      <div class="airspace-search-title">공역검색</div>
      <div class="airspace-search-row">
        <input type="search" maxlength="60" placeholder="예: WSD14" aria-label="공역명 검색" />
        <button type="button">검색</button>
      </div>
      <div class="airspace-search-status">공역명을 입력하세요.</div>
      <div class="airspace-search-items"></div>
      <button type="button" class="airspace-clear-all">전체 지우기</button>
    `;

    const input = container.querySelector("input");
    const searchButton = container.querySelector(".airspace-search-row button");
    const clearButton = container.querySelector(".airspace-clear-all");
    const status = container.querySelector(".airspace-search-status");
    const items = container.querySelector(".airspace-search-items");

    airspaceSearchUi = {
      input,
      searchButton,
      clearButton,
      status,
      items
    };

    L.DomEvent.disableClickPropagation(container);
    L.DomEvent.disableScrollPropagation(container);

    L.DomEvent.on(searchButton, "click", function (event) {
      L.DomEvent.stop(event);
      searchAndAddAirspace(input.value);
    });

    L.DomEvent.on(input, "keydown", function (event) {
      if (event.key === "Enter") {
        L.DomEvent.stop(event);
        searchAndAddAirspace(input.value);
      }
    });

    L.DomEvent.on(clearButton, "click", function (event) {
      L.DomEvent.stop(event);
      clearAllSearchedAirspaces();
    });

    updateAirspaceSearchUi();
    return container;
  };

  return control;
}

async function searchAndAddAirspace(rawQuery) {
  if (isAirspaceSearching) return;

  const query = String(rawQuery || "").trim().toUpperCase();

  if (query.length < 2) {
    setAirspaceSearchStatus("공역명을 2자 이상 입력해주세요.", true);
    return;
  }

  isAirspaceSearching = true;
  updateAirspaceSearchUi();
  setAirspaceSearchStatus(query + " 검색 중...", false);

  try {
    const data = await callAirspaceSearchJsonp(query);

    if (!data || !data.ok) {
      throw new Error((data && data.error) || "공역 조회에 실패했습니다.");
    }

    const results = Array.isArray(data.items) ? data.items : [];

    if (!results.length) {
      setAirspaceSearchStatus(
        query + "에 해당하는 공역을 찾지 못했습니다.",
        true
      );
      return;
    }

    // 정확한 결과가 하나면 바로 추가한다.
    if (results.length === 1) {
      addChosenAirspaceItems(results);
      return;
    }

    // 이름/부분 검색으로 여러 결과가 나오면 사용자가 하나를 선택한다.
    showAirspaceCandidateDialog(results, query);
    setAirspaceSearchStatus(
      results.length + "개의 검색 결과 중 하나를 선택해주세요.",
      false
    );
  } catch (err) {
    console.error(err);
    setAirspaceSearchStatus(err.message || String(err), true);
  } finally {
    isAirspaceSearching = false;
    updateAirspaceSearchUi();
  }
}

function addChosenAirspaceItems(items) {
  const newlyAdded = [];
  const matchedKeys = [];

  (items || []).forEach(item => {
    const key = getSearchedAirspaceKey(item);
    matchedKeys.push(key);

    if (searchedAirspaceItems.has(key)) return;
    if (searchedAirspaceItems.size >= AIRSPACE_MAX_STORED_COUNT) return;

    if (addSearchedAirspaceToMap(item, key)) {
      searchedAirspaceItems.set(key, item);
      newlyAdded.push(key);
    }
  });

  saveSearchedAirspacesToSession();
  updateAirspaceSearchUi();

  const focusKeys = newlyAdded.length ? newlyAdded : matchedKeys;
  fitSearchedAirspaceKeys(focusKeys);

  if (newlyAdded.length) {
    setAirspaceSearchStatus(
      newlyAdded.length + "개 추가 · 총 " + searchedAirspaceItems.size + "개 표시 중",
      false
    );
  } else if (searchedAirspaceItems.size >= AIRSPACE_MAX_STORED_COUNT) {
    setAirspaceSearchStatus(
      "최대 " + AIRSPACE_MAX_STORED_COUNT + "개까지 표시할 수 있습니다.",
      true
    );
  } else {
    setAirspaceSearchStatus("이미 지도에 표시된 공역입니다.", false);
  }
}

function ensureAirspaceCandidateDialog() {
  if (airspaceCandidateDialog) return airspaceCandidateDialog;

  const backdrop = document.createElement("div");
  backdrop.className = "airspace-candidate-backdrop";
  backdrop.hidden = true;
  backdrop.innerHTML = `
    <div class="airspace-candidate-dialog" role="dialog" aria-modal="true" aria-labelledby="airspaceCandidateTitle">
      <div class="airspace-candidate-header">
        <span id="airspaceCandidateTitle">공역 검색 결과</span>
        <button type="button" class="airspace-candidate-close" aria-label="선택창 닫기">×</button>
      </div>
      <div class="airspace-candidate-list" role="radiogroup" aria-label="검색된 공역"></div>
      <div class="airspace-candidate-actions">
        <button type="button" class="airspace-candidate-add">선택 공역 추가</button>
        <button type="button" class="airspace-candidate-cancel">취소</button>
      </div>
    </div>
  `;

  const closeButton = backdrop.querySelector(".airspace-candidate-close");
  const cancelButton = backdrop.querySelector(".airspace-candidate-cancel");
  const addButton = backdrop.querySelector(".airspace-candidate-add");

  closeButton.addEventListener("click", closeAirspaceCandidateDialog);
  cancelButton.addEventListener("click", closeAirspaceCandidateDialog);

  addButton.addEventListener("click", function () {
    const selected = backdrop.querySelector('input[name="airspaceCandidate"]:checked');
    if (!selected) return;

    const index = Number(selected.value);
    const item = pendingAirspaceCandidates[index];
    if (!item) return;

    closeAirspaceCandidateDialog();
    addChosenAirspaceItems([item]);
  });

  backdrop.addEventListener("click", function (event) {
    if (event.target === backdrop) closeAirspaceCandidateDialog();
  });

  document.body.appendChild(backdrop);
  airspaceCandidateDialog = backdrop;
  return backdrop;
}

function showAirspaceCandidateDialog(items, query) {
  const dialog = ensureAirspaceCandidateDialog();
  const title = dialog.querySelector("#airspaceCandidateTitle");
  const list = dialog.querySelector(".airspace-candidate-list");

  pendingAirspaceCandidates = Array.isArray(items) ? items.slice() : [];
  title.textContent = query + " 검색 결과 · " + pendingAirspaceCandidates.length + "개";

  list.innerHTML = pendingAirspaceCandidates.map((item, index) => {
    const identifier = getAirspaceCandidateIdentifier(item);
    const name = String(item.name || identifier || "AIRSPACE");
    const location = String(item.fir || "").trim() || formatOpenAipCountry(item.country);
    const type = getSearchedAirspaceTypeName(item.type);
    const lower = formatOpenAipVerticalLimit(item.lowerLimit);
    const upper = formatOpenAipVerticalLimit(item.upperLimit);
    const checked = index === 0 ? " checked" : "";

    return `
      <label class="airspace-candidate-option">
        <input type="radio" name="airspaceCandidate" value="${index}"${checked} />
        <span>
          <span class="airspace-candidate-name">${escapeHtml(identifier)}${identifier && name !== identifier ? " · " : ""}${name !== identifier ? escapeHtml(name) : ""}</span>
          <span class="airspace-candidate-meta">FIR/국가: ${escapeHtml(location)} · ${escapeHtml(type)} · ${escapeHtml(lower)}–${escapeHtml(upper)}</span>
        </span>
      </label>
    `;
  }).join("");

  dialog.hidden = false;
  document.body.style.overflow = "hidden";

  const firstRadio = dialog.querySelector('input[name="airspaceCandidate"]');
  if (firstRadio) firstRadio.focus({ preventScroll: true });
}

function closeAirspaceCandidateDialog() {
  if (!airspaceCandidateDialog) return;

  airspaceCandidateDialog.hidden = true;
  pendingAirspaceCandidates = [];
  document.body.style.overflow = "";
}

function getAirspaceCandidateIdentifier(item) {
  const explicit = String(item && item.identifier || "").trim().toUpperCase();
  if (explicit) return explicit;

  const name = String(item && item.name || "").trim().toUpperCase();
  const match = name.match(/^([A-Z]{2,5}-?[A-Z]?\d+[A-Z]?)\b/);
  return match ? match[1] : "";
}

function callAirspaceSearchJsonp(query) {
  return new Promise((resolve, reject) => {
    const callbackName =
      "openAipAirspaceCallback_" +
      Date.now() + "_" + Math.floor(Math.random() * 100000);

    const params = new URLSearchParams({
      action: "airspacesearch",
      query: query,
      callback: callbackName,
      _: String(Date.now())
    });

    const script = document.createElement("script");
    script.src = AIRSPACE_SEARCH_BACKEND_URL + "?" + params.toString();

    const timeout = setTimeout(() => {
      cleanup();
      reject(new Error("공역 조회 시간이 초과되었습니다."));
    }, 30000);

    window[callbackName] = function (data) {
      cleanup();
      resolve(data);
    };

    script.onerror = function () {
      cleanup();
      reject(new Error("공역 검색 백엔드에 연결할 수 없습니다."));
    };

    function cleanup() {
      clearTimeout(timeout);
      delete window[callbackName];

      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }
    }

    document.body.appendChild(script);
  });
}

function getSearchedAirspaceKey(item) {
  if (item && item._id) return String(item._id);

  return [
    item && item.name,
    item && item.type,
    JSON.stringify(item && item.geometry)
  ].join("|");
}

function addSearchedAirspaceToMap(item, key) {
  if (
    !item ||
    !item.geometry ||
    (item.geometry.type !== "Polygon" && item.geometry.type !== "MultiPolygon")
  ) {
    return false;
  }

  const rings = getGeoJsonRings(item.geometry);
  if (!rings.length) return false;

  const polygonRings = rings
    .map(ring => normalizeGeoJsonRingToLatLng(ring, GLOBAL_WORLD_REFERENCE_LON))
    .filter(ring => ring.length >= 3);

  if (!polygonRings.length) return false;

  const group = L.featureGroup();
  const style = getSearchedAirspaceStyle(item.type);
  const polygon = L.polygon(polygonRings, style).addTo(group);

  polygon.bindPopup(buildSearchedAirspacePopup(item), POPUP_OPTIONS);
  polygon.bindTooltip(
    `<span class="openaip-airspace-label-text">${escapeHtml(item.name || item.identifier || "AIRSPACE")}</span>`,
    {
    permanent: true,
    direction: "center",
    className: "openaip-airspace-label",
    opacity: 0.95
    }
  );

  polygon.on("mouseover", function () {
    polygon.setStyle({ weight: style.weight + 2, fillOpacity: 0.35 });
  });

  polygon.on("mouseout", function () {
    polygon.setStyle(style);
  });

  group.addTo(searchedAirspaceLayer);
  searchedAirspaceLayers.set(key, group);
  return true;
}

function getSearchedAirspaceStyle(type) {
  const typeNumber = Number(type);
  let color = "#7c3aed"; // Military

  if (typeNumber === 1) color = "#f97316";       // Restricted
  if (typeNumber === 2) color = "#eab308";       // Danger
  if (typeNumber === 3) color = "#dc2626";       // Prohibited

  return {
    color,
    weight: 3,
    opacity: 0.95,
    fillColor: color,
    fillOpacity: 0.20,
    dashArray: typeNumber === 2 ? "8 5" : null
  };
}

function getSearchedAirspaceTypeName(type) {
  const typeNumber = Number(type);
  const names = {
    1: "RESTRICTED",
    2: "DANGER",
    3: "PROHIBITED",
    14: "MILITARY ATZ (MATZ)",
    16: "MILITARY TRAINING ROUTE (MTR)",
    17: "ALERT",
    18: "WARNING",
    25: "MILITARY TRAINING AREA (MTA)",
    30: "MILITARY ROUTE (MRT)",
    36: "MILITARY CTR (MCTR)"
  };

  if (Object.prototype.hasOwnProperty.call(names, typeNumber)) {
    return names[typeNumber];
  }

  return Number.isFinite(typeNumber)
    ? "AIRSPACE TYPE " + typeNumber
    : "AIRSPACE";
}

function formatOpenAipVerticalLimit(limit) {
  if (!limit || !Number.isFinite(Number(limit.value))) return "-";

  const value = Number(limit.value);
  const unit = Number(limit.unit);
  const datum = Number(limit.referenceDatum);

  if (value === 0 && datum === 0) return "SFC";
  if (unit === 6) return "FL" + value;

  const unitText = unit === 0 ? "m" : "ft";
  const datumText = datum === 0 ? "AGL" : datum === 1 ? "MSL" : "STD";
  return value.toLocaleString() + " " + unitText + " " + datumText;
}

function formatOpenAipCountry(country) {
  const countryCodes = Array.isArray(country) ? country : [country];

  return countryCodes
    .map(code => String(code || "").trim())
    .filter(Boolean)
    .map(rawCountry => {
      if (!/^[A-Za-z]{2}$/.test(rawCountry)) {
        return rawCountry;
      }

      const code = rawCountry.toUpperCase();

      try {
        if (typeof Intl.DisplayNames === "function") {
          const regionNames = new Intl.DisplayNames(["ko"], { type: "region" });
          return regionNames.of(code) || code;
        }
      } catch (_) {}

      const fallbackNames = {
        MY: "말레이시아",

function restoreSearchedAirspacesFromSession() {
  let savedItems = [];

  try {
    savedItems = JSON.parse(
      sessionStorage.getItem(AIRSPACE_SESSION_STORAGE_KEY) || "[]"
    );
  } catch (_) {
    savedItems = [];
  }

  if (!Array.isArray(savedItems)) return;

  savedItems.slice(0, AIRSPACE_MAX_STORED_COUNT).forEach(item => {
    const key = getSearchedAirspaceKey(item);

    if (!searchedAirspaceItems.has(key) && addSearchedAirspaceToMap(item, key)) {

  updateAirspaceSearchUi();

  if (searchedAirspaceItems.size) {
    fitSearchedAirspaceKeys(Array.from(searchedAirspaceItems.keys()));
  }
}

async function searchAirportOnTrackingMap(rawIcao) {
  if (isAirportSearching) return;

  const icao = String(rawIcao || "").trim().toUpperCase();

  if (!/^[A-Z]{4}$/.test(icao)) {
    setAirportSearchStatus("ICAO 4자리 코드를 입력해주세요.", true);
    return;
  }

  isAirportSearching = true;
  updateAirportSearchUi();
  setAirportSearchStatus(icao + " 검색 중...", false);

  try {
    const data = await callAirportSearchJsonp(icao);

    if (!data || !data.ok) {
      throw new Error((data && data.error) || "공항 조회에 실패했습니다.");
    }

    const airport = data.airport;
    const coordinates = airport && airport.geometry && airport.geometry.coordinates;

    if (!airport || !Array.isArray(coordinates)) {
      setAirportSearchStatus(icao + " 공항을 찾지 못했습니다.", true);
      return;
    }

    const lat = Number(coordinates[1]);
    const rawLon = Number(coordinates[0]);

    if (!Number.isFinite(lat) || !Number.isFinite(rawLon)) {
      throw new Error("공항 좌표가 올바르지 않습니다.");
    }

    // 항로·공역과 동일한 world copy를 사용한다.
    // 예: 미국 서경 -77°는 +283°로 이동해 태평양 항로 기준 오른쪽에 표시.
    const lon = shiftLonNearReference(rawLon, GLOBAL_WORLD_REFERENCE_LON);
    const latlng = [lat, lon];

    airportSearchLayer.clearLayers();

    const icon = L.divIcon({
      className: "",
      html: `
        <div class="tracking-airport-marker">
          <div class="tracking-airport-arrow">▼</div>
        </div>
      `,
      iconSize: [42, 46],
      iconAnchor: [21, 42]
    });

    const marker = L.marker(latlng, {
      icon,
      zIndexOffset: 5000
    }).addTo(airportSearchLayer);

    marker.bindTooltip(icao, {
      permanent: true,
      direction: "top",
      offset: [0, -11],
      className: "tracking-airport-label"
    });

    map.setView(latlng, 10, { animate: false });

    const countryName = formatOpenAipCountry(airport.country);
    const airportName = String(airport.name || "").trim();

    setAirportSearchStatus(
      [icao, airportName, countryName].filter(Boolean).join(" · "),
      false
    );

    // NOAA 모델 overlay도 같은 공항 좌표를 사용한다.
    setNoaaModelAirport({
      icao,
      lat,
      lon: rawLon,
      name: airportName || ""
    });
  } catch (err) {
    console.error(err);
    setAirportSearchStatus(err.message || String(err), true);
  } finally {
    isAirportSearching = false;
    updateAirportSearchUi();
  }
}

function callAirportSearchJsonp(icao) {
  return new Promise((resolve, reject) => {
    const callbackName =
      "openAipAirportCallback_" +
      Date.now() + "_" + Math.floor(Math.random() * 100000);

    const params = new URLSearchParams({
      action: "airportsearch",
      icao: icao,
      callback: callbackName,
      _: String(Date.now())
    });

    const script = document.createElement("script");
    script.src = AIRSPACE_SEARCH_BACKEND_URL + "?" + params.toString();

    const timeout = setTimeout(() => {
      cleanup();
      reject(new Error("공항 조회 시간이 초과되었습니다."));
    }, 30000);

    window[callbackName] = function (data) {
      cleanup();
      resolve(data);
    };

    script.onerror = function () {
      cleanup();
      reject(new Error("공항 검색 백엔드에 연결할 수 없습니다."));
    };

    function cleanup() {
      clearTimeout(timeout);
      delete window[callbackName];

      if (script.parentNode) {
        script.parentNode.removeChild(script);
      }
    }

    document.body.appendChild(script);
  });
}

async function loadNhcWindRadii() {
  if (!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec(?:\?.*)?$/.test(TOKYO_VAAC_BACKEND_URL)) return {};
  return new Promise((resolve, reject) => {
    const callback = 'nhcWindCb' + Date.now() + Math.floor(Math.random()*100000);
    const script = document.createElement('script');
    let done = false;
    const timer = setTimeout(() => finish(new Error('NHC 바람 반경 요청 시간 초과')), 20000);
    function finish(error, payload) {
      if (done) return;
      done = true; clearTimeout(timer); delete window[callback]; script.remove();
      if (error) reject(error);
      else if (!payload?.ok) reject(new Error(payload?.error || 'NHC 바람 반경 응답 오류'));
      else resolve(payload.storms || {});
    }
    window[callback] = payload => finish(null, payload);
    script.onerror = () => finish(new Error('NHC 바람 반경 서버 접속 실패'));
    script.src = TOKYO_VAAC_BACKEND_URL + (TOKYO_VAAC_BACKEND_URL.includes('?') ? '&' : '?') +
      'action=nhcWind&callback=' + callback;
    document.head.appendChild(script);
  });
}

function getJtwcKmzLinks(rssText) {
  const doc = parseXml(rssText);
  if (doc.querySelector("parsererror")) throw new Error("JTWC RSS XML 오류");
  const urls = new Set();
  for (const item of doc.getElementsByTagName("item")) {
    const desc = textOfFirst(item, "description");
    const matches = desc.matchAll(/https:\/\/www\.metoc\.navy\.mil\/jtwc\/products\/[a-z0-9]+\.kmz/gi);
    for (const match of matches) urls.add(match[0]);
  }
  return [...urls];
}

async function loadJtwcStorm(url) {
  const response = await fetch(url, { cache: "no-store" });
  if (!response.ok) throw new Error(`${url}: HTTP ${response.status}`);
  if (!window.JSZip) throw new Error("KMZ 압축 해제 라이브러리를 불러오지 못했습니다");
  const archive = await JSZip.loadAsync(await response.arrayBuffer());
  const kmlFile = archive.file("doc.kml") || Object.values(archive.files).find(f => /\.kml$/i.test(f.name));
  if (!kmlFile) throw new Error(`${url}: KML 파일이 없습니다`);
  const doc = parseXml(await kmlFile.async("string"));
  if (doc.querySelector("parsererror")) throw new Error(`${url}: KML XML 오류`);
  const stormId = new URL(url).pathname.split("/").pop().replace(/\.kmz$/i, "").toUpperCase();
  const result = L.featureGroup();
  // JTWC KMZ에는 수일간의 과거 Best Track이 별도 Folder로 들어 있다.
  // 현재 위치와 예보 경로만 남겨 긴 과거 이동 궤적을 지도에서 제외한다.
  const isHistoricalPlacemark = pm => {
    for (let parent = pm.parentElement; parent; parent = parent.parentElement) {
      if (parent.localName !== "Folder") continue;
      const directName = [...parent.children].find(child => child.localName === "name");
      if (directName && /previous\s+best\s+track|past\s+track|historical/i.test(directName.textContent)) {
        return true;
      }
    }
    return /^(?:Best Track|\d{8}Z)$/i.test(textOfFirst(pm, "name"));
  };
  const placemarks = [...doc.getElementsByTagName("Placemark")]
    .filter(pm => !isHistoricalPlacemark(pm));
  const context = { referenceLon: GLOBAL_WORLD_REFERENCE_LON };
  const warningPlacemark = placemarks.find(pm =>
    pm.getElementsByTagName("Point").length && /WARNING NR/i.test(textOfFirst(pm, "name"))
  );
  const warningName = warningPlacemark ? textOfFirst(warningPlacemark, "name") : "";
  const stormMatch = warningName.match(/\b(SUPER TYPHOON|TYPHOON|HURRICANE|TROPICAL STORM|TROPICAL DEPRESSION|TROPICAL CYCLONE)\s+(\d{1,2}[A-Z])(?:\s*\(([^)]+)\))?/i);
  const titleCase = value => String(value).toLowerCase().replace(/\b[a-z]/g, letter => letter.toUpperCase());
  const stormTitle = stormMatch
    ? `${titleCase(stormMatch[1])} ${stormMatch[2].toUpperCase()}${stormMatch[3] ? ` (${titleCase(stormMatch[3])})` : ""}`
    : "Tropical Cyclone Formation Alert";
  result.jtwcStormId = stormId;
  result.jtwcName = stormMatch?.[3] || '';
  const popup = name => {
    let detail = "";
    if (/^\d{1,2}\/\d{2}Z\s*-/i.test(name)) detail = name.trim();
    else if (name === warningName) {
      const validTime = name.match(/^(\d{1,2}\/\d{2}Z)/);
      const wind = name.match(/-\s*(\d+)\s*knots/i);
      detail = [validTime?.[1], wind ? `${wind[1]} knots` : ""].filter(Boolean).join(" - ");
    }
    const heading = detail
      ? `<b>${escapeHtml(detail)}</b><br>${escapeHtml(stormTitle)}`
      : `<b>${escapeHtml(stormTitle)}</b>`;
    return `${heading}<br><a href="${url}" target="_blank" rel="noopener noreferrer">원본 KMZ</a>`;
  };

  // 풍속 반경을 먼저 그려 경로와 위치 점이 위에 보이도록 한다.
  for (const pm of placemarks) {
    const name = textOfFirst(pm, "name");
    for (const node of pm.getElementsByTagName("Polygon")) {
      const outer = node.getElementsByTagName("outerBoundaryIs")[0];
      const coords = parseCoordinates(textOfFirst(outer || node, "coordinates"));
      if (coords.length < 3) continue;
      const color = /64\s*KT/i.test(name) ? "#ef4444" : /50\s*KT/i.test(name) ? "#f97316" : "#facc15";
      // Danger Swath와 34/50/64 kt 반경은 시각 자료로만 표시한다.
      // 클릭 정보는 현재·예보 위치 점의 중심풍속에 남긴다.
      L.polygon(toRenderLatLngsFromCoords(coords, context), {
        color, weight: 1, opacity: 0.7, fillColor: color, fillOpacity: 0.12,
        interactive: false
      }).addTo(result);
    }
  }
  let currentMarkerPlaced = false;
  for (const pm of placemarks) {
    const name = textOfFirst(pm, "name");
    for (const node of pm.getElementsByTagName("LineString")) {
      const coords = parseCoordinates(textOfFirst(node, "coordinates"));
      if (coords.length < 2) continue;
      L.polyline(toRenderLatLngsFromCoords(coords, context), {
        color: /best|past/i.test(name) ? "#64748b" : "#dc2626", weight: 3,
        dashArray: /best|past/i.test(name) ? null : "8 5",
        interactive: false
      }).addTo(result);
    }
    for (const node of pm.getElementsByTagName("Point")) {
      const coords = parseCoordinates(textOfFirst(node, "coordinates"));
      if (!coords.length) continue;
      const isCurrentPoint = !currentMarkerPlaced && (
        /^\d{1,2}\/\d{2}Z\b/.test(name) ||
        /VALID TIME:\s*\d{1,2}\/\d{4}Z/i.test(name)
      );
      const latlng = toRenderLatLng(coords[0].lat, coords[0].lon, context);
      L.circleMarker(latlng, {
        radius: 5,
        color: isCurrentPoint ? "#1e3a8a" : "#991b1b",
        fillColor: isCurrentPoint ? "#2563eb" : "#ffffff",
        fillOpacity: 1,
        weight: 2,
        interactive: false
      }).addTo(result);
      // 보이는 원 크기는 유지하고 클릭 영역만 넓힌다.
      const clickTarget = L.circleMarker(latlng, {
        radius: 9,
        stroke: false,
        fillColor: "#ffffff",
        fillOpacity: 0.001,
        bubblingMouseEvents: false
      }).bindPopup(popup(name)).addTo(result);
      clickTarget.jtwcMaxClickRadius = 9;
      if (isCurrentPoint) currentMarkerPlaced = true;
    }
  }
  if (!result.getLayers().length) throw new Error(`${stormId}: 표시할 경로가 없습니다`);
  return result;
}

async function loadNhcAtlanticStorms() {
  const query = new URLSearchParams({
    where: "BASIN='AL'",
    outFields: "STORMNAME,STORMNUM,STORMTYPE,TCDVLP,MAXWIND,VALIDTIME,TAU,ADVDATE,ADVISNUM,BASIN",
    returnGeometry: "true",
    outSR: "4326",
    f: "geojson"
  });
  const response = await fetch(`${NHC_ATLANTIC_POINTS_URL}?${query}`, {
    cache: "no-store",
    signal: AbortSignal.timeout(15000)
  });
  if (!response.ok) throw new Error(`NHC 예보 HTTP ${response.status}`);
  const data = await response.json();
  if (data.error || !Array.isArray(data.features)) throw new Error("NHC 예보 데이터 형식 오류");
  let nhcRadii = {};
  try { nhcRadii = await loadNhcWindRadii(); }
  catch (error) { console.warn('NHC 바람 반경 자료 조회 실패:', error); }

  // 예보 경로의 불확실성 범위. 바람 반경과 다른 자료이므로 별도 스타일로 그린다.
  let coneFeatures = [];
  try {
    const coneQuery = new URLSearchParams({
      where: "BASIN='AL'",
      outFields: "STORMNUM,ADVDATE,BASIN",
      returnGeometry: "true", outSR: "4326", f: "geojson"
    });
    const coneResponse = await fetch(`${NHC_ATLANTIC_CONE_URL}?${coneQuery}`, {
      cache: "no-store", signal: AbortSignal.timeout(15000)
    });
    if (!coneResponse.ok) throw new Error(`HTTP ${coneResponse.status}`);
    const cones = await coneResponse.json();
    if (!Array.isArray(cones.features) || cones.error) throw new Error("예보 범위 형식 오류");
    coneFeatures = cones.features;
  } catch (error) {
    console.warn("NHC 예보 범위 조회 실패, 경로만 표시:", error);
  }

  const storms = new Map();
  for (const feature of data.features) {
    const props = feature.properties || {};
    const coordinates = feature.geometry?.coordinates;
    const tau = Number(props.TAU);
    const issued = Number(props.ADVDATE);
    if (props.BASIN !== "AL" || !Array.isArray(coordinates) || coordinates.length < 2 ||
        !Number.isFinite(coordinates[0]) || !Number.isFinite(coordinates[1]) ||
        !Number.isFinite(tau) || tau < 0 || tau > 120 ||
        // NHC의 정규 발표 간격과 지연을 허용하되 오래된 예보는 제외한다.
        !Number.isFinite(issued) || Date.now() - issued > 18 * 3600000 ||
        issued - Date.now() > 3600000) continue;
    const number = Number(props.STORMNUM);
    if (!Number.isFinite(number)) continue;
    const id = `AL${String(Math.round(number)).padStart(2, "0")}`;
    if (!storms.has(id)) storms.set(id, []);
    storms.get(id).push(feature);
  }

  // NHC polygon/path coordinates must be unwrapped as ONE continuous sequence.
  // Rendering every longitude independently can put one vertex on a neighboring
  // 360° world copy and create a long line across the map.
  function renderNhcSequence_(coordinates, anchorLon) {
    if (!Array.isArray(coordinates) || !coordinates.length) return [];

    const first = coordinates[0];
    if (!Array.isArray(first) || first.length < 2) return [];

    let prevLon = shiftLonNearReference(Number(first[0]), anchorLon);
    const out = [[Number(first[1]), prevLon]];

    for (let i = 1; i < coordinates.length; i++) {
      const pair = coordinates[i];
      if (!Array.isArray(pair) || pair.length < 2) continue;

      const lat = Number(pair[1]);
      const lon = Number(pair[0]);
      if (!Number.isFinite(lat) || !Number.isFinite(lon)) continue;

      const nextLon = unwrapLonNext(prevLon, lon);
      out.push([lat, nextLon]);
      prevLon = nextLon;
    }

    return out;
  }

  const layers = [];
  for (const [id, entries] of storms) {
    // 같은 폭풍의 새 예보가 들어오면 최신 발표의 위치만 사용한다.
    const newest = Math.max(...entries.map(item => Number(item.properties.ADVDATE)));
    const points = entries.filter(item => Number(item.properties.ADVDATE) === newest)
      .sort((a, b) => Number(a.properties.TAU) - Number(b.properties.TAU));
    if (!points.length) continue;
    const current = points.find(item => Number(item.properties.TAU) === 0) || points[0];
    const name = String(current.properties.STORMNAME || "Unnamed").trim();
    const rawType = String(current.properties.TCDVLP || "Tropical Cyclone").trim();
    const type = /major hurricane/i.test(rawType) ? "Hurricane" : rawType;
    const title = `${type} ${id.slice(2)}L (${name})`;
    const advisory = String(current.properties.ADVISNUM ?? "").trim().toUpperCase();
    const context = { referenceLon: GLOBAL_WORLD_REFERENCE_LON };
    const group = L.featureGroup();
    group.nhcStormId = id;
    group.nhcStormName = name;
    // 화면에 반복된 세계지도 중 오른쪽 복제 지도에 대서양 폭풍을 표시한다.
    // 한 폭풍의 모든 점에는 같은 360도 이동값을 적용해 경로가 끊기지 않게 한다.
    const firstCoord = current.geometry.coordinates;
    const baseFirst = toRenderLatLng(firstCoord[1], firstCoord[0], context);
    const mapWidth = map.getSize().x;
    const copies = [-720, -360, 0, 360, 720].map(shift => ({
      shift, x: map.latLngToContainerPoint([baseFirst[0], baseFirst[1] + shift]).x
    }));
    const visibleCopies = copies.filter(c => c.x >= 0 && c.x <= mapWidth);
    const bestCopy = (visibleCopies.length ? visibleCopies : copies)
      .sort((a, b) => Math.abs(a.x - mapWidth * 0.77) - Math.abs(b.x - mapWidth * 0.77))[0];
    const stormAnchorLon = baseFirst[1] + bestCopy.shift;
    // 해당 폭풍의 같은 발표 시각에 나온 cone만 사용한다.
    for (const cone of coneFeatures) {
      const p = cone.properties || {};
      if (Number(p.STORMNUM) !== Number(id.slice(2)) || Number(p.ADVDATE) !== newest) continue;
      const geometry = cone.geometry;
      if (!geometry || !["Polygon", "MultiPolygon"].includes(geometry.type)) continue;
      const polygons = geometry.type === "Polygon" ? [geometry.coordinates] : geometry.coordinates;
      for (const rings of polygons) {
        if (!Array.isArray(rings) || !Array.isArray(rings[0]) || rings[0].length < 3) continue;
        const latlngs = rings
          .map(ring => renderNhcSequence_(ring, stormAnchorLon))
          .filter(ring => ring.length >= 3);
        L.polygon(latlngs, {
          color: "#f59e0b", weight: 1, fillColor: "#fbbf24", fillOpacity: 0.12,
          interactive: false
        }).addTo(group);
      }
    }
    // JTWC와 동일하게 실제 원본 KMZ에 존재하는 34/50/64 kt 영역만 표시한다.
    // 발표 번호가 서로 다르면 오래된 반경이 최신 경로에 붙지 않도록 제외한다.
    const officialRadii = nhcRadii[`${id}${new Date(newest).getUTCFullYear()}`];
    if (officialRadii?.warnings?.length) console.warn(`NHC ${id} wind radii:`, officialRadii.warnings);
    // NHC의 최신 Watches/Warnings Forecast Cone으로 바로 이동한다.
    // #contents가 없으면 페이지 하단 등 이전 스크롤 위치로 열릴 수 있다.
    const nhcGraphicsUrl = /^https:\/\/www\.nhc\.noaa\.gov\/graphics_at\d+\.shtml$/.test(officialRadii?.graphicsUrl || '')
      ? `${officialRadii.graphicsUrl}?cone#contents` : 'https://www.nhc.noaa.gov/';
    if (officialRadii && officialRadii.advisory === advisory.padStart(3, '0')) {
      for (const region of officialRadii.polygons || []) {
        if (![34,50,64].includes(region.windKt) || !Array.isArray(region.coordinates) || region.coordinates.length < 3) continue;
        const color = region.windKt === 64 ? '#ef4444' : region.windKt === 50 ? '#f97316' : '#facc15';
        const area = renderNhcSequence_(region.coordinates, stormAnchorLon);
        if (area.length < 3) continue;
        L.polygon(area, {color, weight:1, opacity:.7, fillColor:color, fillOpacity:.12, interactive:false})
          .addTo(group);
      }
    }
    const positions = renderNhcSequence_(
      points.map(item => item.geometry.coordinates),
      stormAnchorLon
    );
    if (positions.length > 1) {
      L.polyline(positions, { color: "#dc2626", weight: 3, dashArray: "8 5", interactive: false })
        .addTo(group);
    }
    points.forEach((item, index) => {
      const isCurrent = item === current;
      const valid = String(item.properties.VALIDTIME || "").match(/^(\d{1,2})\/(\d{2})\d{2}$/);
      const time = valid ? `${valid[1]}/${valid[2]}Z` : "";
      const wind = Number(item.properties.MAXWIND);
      const detail = [time, Number.isFinite(wind) && wind > 0 ? `${wind} knots` : ""]
        .filter(Boolean).join(" - ");
      const popup = `${detail ? `<b>${escapeHtml(detail)}</b><br>` : ""}${escapeHtml(title)}` +
        `<br><a href="${nhcGraphicsUrl}" target="_blank" rel="noopener noreferrer">NHC 공식 태풍 정보</a>`;
      L.circleMarker(positions[index], {
        radius: 5,
        color: isCurrent ? "#1e3a8a" : "#991b1b",
        fillColor: isCurrent ? "#2563eb" : "#ffffff",
        fillOpacity: 1, weight: 2, interactive: false
      }).addTo(group);
      const hit = L.circleMarker(positions[index], {
        radius: 9, stroke: false,
        fillColor: "#ffffff", fillOpacity: 0.001, bubblingMouseEvents: false
      }).bindPopup(popup).addTo(group);
      hit.jtwcMaxClickRadius = 9;
    });
    layers.push(group);
  }
  return layers;
}

function updateTyphoonClickTargets() {
  if (!typhoonVisible) return;
  const targets = [];
  typhoonLayer.eachLayer(storm => storm.eachLayer(layer => {
    if (layer.jtwcMaxClickRadius) targets.push(layer);
  }));
  const positions = targets.map(target => map.latLngToLayerPoint(target.getLatLng()));
  targets.forEach((target, i) => {
    let nearest = Infinity;
    positions.forEach((point, j) => {
      if (i !== j) nearest = Math.min(nearest, positions[i].distanceTo(point));
    });
    // 가장 가까운 다른 태풍 위치까지의 거리 절반을 넘지 않게 제한한다.
    target.setRadius(Math.min(target.jtwcMaxClickRadius, Math.max(0, (nearest - 2) / 2)));
  });
}
map.on("zoomend", updateTyphoonClickTargets);


async function loadNhcAtlanticStormsWithRetry_(maxRetries = 2) {
  let lastError = null;

  for (let attempt = 0; attempt <= maxRetries; attempt++) {
    try {
      return await loadNhcAtlanticStorms();
    } catch (error) {
      lastError = error;
      console.warn(
        `NHC 대서양 자료 조회 실패 (${attempt + 1}/${maxRetries + 1})`,
        error
      );

      if (attempt < maxRetries) {
        // 1차 실패 후 0.8초, 2차 실패 후 1.6초 대기 후 재시도
        await new Promise(resolve => setTimeout(resolve, 800 * (attempt + 1)));
      }
    }
  }

  throw lastError || new Error("NHC 대서양 자료 조회 실패");
}

function createTyphoonControl() {
  const control = L.control({ position: "topright" });

  control.onAdd = function () {
    const container = L.DomUtil.create(
      "div",
      "leaflet-bar leaflet-control leaflet-control-typhoon control-group-weather control-group-start"
    );
    const button = L.DomUtil.create("button", "", container);
    button.type = "button";

    const update = () => {
      button.textContent = typhoonVisible ? "태풍 ON" : "태풍 OFF";
      button.classList.toggle("typhoon-on", typhoonVisible);
      button.title = typhoonVisible
        ? "태풍 표시 끄기 (JTWC·NHC)"
        : "태풍 표시 켜기 (JTWC·NHC)";
    };

    update();
    L.DomEvent.disableClickPropagation(container);
    L.DomEvent.disableScrollPropagation(container);

    L.DomEvent.on(button, "click", async e => {
      L.DomEvent.stop(e);

      if (typhoonVisible) {
        map.removeLayer(typhoonLayer);
        typhoonVisible = false;
        update();
        return;
      }

      button.disabled = true;
      button.textContent = "...";

      // 두 소스를 독립적으로 시작한다.
      // NHC가 실패/지연돼도 JTWC 표출을 막지 않는다.
      const jtwcPromise = (async () => {
        const response = await fetch(JTWC_RSS_URL, { cache: "no-store" });
        if (!response.ok) throw new Error(`JTWC RSS HTTP ${response.status}`);

        const links = getJtwcKmzLinks(await response.text());
        const loaded = await Promise.allSettled(links.map(loadJtwcStorm));

        const layers = loaded.flatMap((entry, i) => {
          if (entry.status === "fulfilled") return [entry.value];
          console.error("JTWC storm load failed:", links[i], entry.reason);
          return [];
        });

        if (links.length && !layers.length) {
          throw new Error("JTWC 태풍 KMZ를 읽지 못했습니다");
        }

        return {
          layers,
          missing: links.length - layers.length
        };
      })();

      // 대서양 NHC는 최초 1회 + 자동 RETRY 2회 (총 3회 시도)
      const nhcPromise = loadNhcAtlanticStormsWithRetry_(2);

      typhoonLayer.clearLayers();

      let jtwcResult = null;
      let nhcResult = null;
      let jtwcError = null;
      let nhcError = null;
      let success = 0;

      try {
        // JTWC를 먼저 처리하여 NHC fetch가 느리거나 실패해도 바로 표시한다.
        try {
          jtwcResult = await jtwcPromise;

          for (const layer of jtwcResult.layers) {
            typhoonLayer.addLayer(layer);
            success++;
          }

          if (success > 0) {
            typhoonLayer.addTo(map);
            typhoonVisible = true;
            updateTyphoonClickTargets();
            update();
          }

          if (jtwcResult.missing) {
            console.warn(`JTWC ${jtwcResult.missing}개 파일 실패`);
          }
        } catch (error) {
          jtwcError = error;
          console.error("JTWC load failed:", error);
        }

        // NHC는 별도로 완료를 기다린다. 실패해도 위 JTWC layer는 그대로 유지된다.
        try {
          const nhcLayers = await nhcPromise;
          nhcResult = { layers: nhcLayers };

          const jtwcLayers = jtwcResult?.layers || [];
          const duplicateNHC = layer => jtwcLayers.some(jtwc => {
            const jtwcId = String(jtwc.jtwcStormId || "").toUpperCase();
            return jtwcId.startsWith(layer.nhcStormId) ||
              (
                jtwcId.startsWith("AL") &&
                jtwc.jtwcName &&
                jtwc.jtwcName.toUpperCase() ===
                  String(layer.nhcStormName || "").toUpperCase()
              );
          });

          for (const layer of nhcLayers) {
            if (duplicateNHC(layer)) continue;
            typhoonLayer.addLayer(layer);
            success++;
          }

          if (success > 0 && !map.hasLayer(typhoonLayer)) {
            typhoonLayer.addTo(map);
          }

          if (success > 0) {
            typhoonVisible = true;
            updateTyphoonClickTargets();
            update();
          }
        } catch (error) {
          nhcError = error;
          console.error(
            "NHC 대서양 load failed after automatic retries:",
            error
          );
          // 중요: 여기서는 throw하지 않는다.
          // JTWC가 이미 성공했다면 그대로 정상 표출을 유지한다.
        }

        if (!success) {
          const failures = [];
          if (jtwcError) {
            failures.push(`JTWC: ${jtwcError.message || jtwcError}`);
          }
          if (nhcError) {
            failures.push(`NHC 대서양: ${nhcError.message || nhcError}`);
          }

          if (failures.length) {
            throw new Error(failures.join(" / "));
          }

          alert("현재 표시할 태풍 예보가 없습니다.");
          return;
        }

        // 일부 소스 실패는 지도 표출을 중단하지 않는다.
        if (nhcError && jtwcResult?.layers?.length) {
          console.warn(
            "NHC 대서양 자료는 실패했지만 JTWC 태풍은 정상 표시 중입니다."
          );
        }
      } catch (err) {
        console.error("Typhoon load failed:", err);
        alert("태풍 표시 실패: " + (err.message || err));
      } finally {
        button.disabled = false;
        update();
      }
    });

    return container;
  };

  return control;
}

function spcRiskMeta(properties, headlineText) {
  const text = String(headlineText || "").toUpperCase();

  // NO SEVERE 문구는 clicked polygon DN보다 우선한다.
  if (/\bNO\s+SEVERE\b|NO\s+SEVERE\s+THUNDERSTORM\s+AREAS?\s+FORECAST/.test(text)) {
    return SPC_RISK_TEXT[2];
  }

  if (/\bHIGH\s+RISK\b/.test(text)) return SPC_RISK_TEXT[8];
  if (/\bMODERATE\s+RISK\b/.test(text)) return SPC_RISK_TEXT[6];
  if (/\bENHANCED\s+RISK\b/.test(text)) return SPC_RISK_TEXT[5];
  if (/\bSLIGHT\s+RISK\b/.test(text)) return SPC_RISK_TEXT[4];
  if (/\bMARGINAL\s+RISK\b/.test(text)) return SPC_RISK_TEXT[3];

  // 문구가 새 형식이어도 오류 없이 공식 DN으로 fallback.
  return SPC_RISK_TEXT[Number(properties?.DN)] || {
    code: "",
    label: "SPC Outlook",
    tone: "neutral",
    message: "SPC 대류 전망"
  };
}

function spcRiskCssClass(tone) {

}

function spcNaturalizeKorean(textValue) {
  let s = String(textValue || "");

  const replacements = [
    [/아니요\s+SEVERE\s+THUNDERSTORM\s+지역\s+예측/gi, "severe thunderstorm 위험 지역 없음"],
    [/NO\s+SEVERE\s+THUNDERSTORM\s+AREAS?\s+FORECAST/gi, "severe thunderstorm 위험 지역 없음"],

    [/Severe thunderstorms은/gi, "severe thunderstorms가"],
    [/Severe thunderstorms는/gi, "severe thunderstorms가"],
    [/severe thunderstorms은/gi, "severe thunderstorms가"],

  for (const [pattern, replacement] of replacements) {

// 이 지도는 태평양 중심으로 사용하므로 미국 예보는 오른쪽 world copy(+360°)에 표시한다.
const US_RIGHT_WORLD_SHIFT = 360;
const US_RIGHT_CONUS_BOUNDS = L.latLngBounds([[24, 235], [50, 294]]);

function shiftGeometryLongitude(geometry, shift = US_RIGHT_WORLD_SHIFT) {
  if (!geometry || !Array.isArray(geometry.coordinates)) return geometry;

  const shiftCoordinates = coordinates => {
    if (!Array.isArray(coordinates)) return coordinates;

    if (
      coordinates.length >= 2 &&
      typeof coordinates[0] === "number" &&
      typeof coordinates[1] === "number"
    ) {
      return [coordinates[0] + shift, coordinates[1], ...coordinates.slice(2)];
    }

    return coordinates.map(shiftCoordinates);
  };

  return {
    ...geometry,
    coordinates: shiftCoordinates(geometry.coordinates)
  };
}

function spcOutlookDate(properties) {
  // SevereWeatherOutlook 메인 페이지에서 선택된 날짜를 최우선으로 사용한다.
  // 지도 GeoJSON의 VALID_ISO와 상세 페이지 날짜가 서로 다른 사이클로 보이는 경우에도
  // 팝업 본문은 드롭다운에서 선택한 사이트 날짜와 반드시 동일하게 맞춘다.
  const siteDate = String(properties?.__SEVERE_DATE_KEY || "").trim();
  if (/^\d{4}-\d{2}-\d{2}$/.test(siteDate)) return siteDate;

  const raw = properties?.VALID_ISO || properties?.ISSUE_ISO || "";
  const date = raw ? new Date(raw) : new Date();
  if (Number.isNaN(date.getTime())) return new Date().toISOString().slice(0, 10);
  return date.toISOString().slice(0, 10);
}

function cleanSevereText(value) {
  return String(value || "")
    .replace(/^\s*>\s?/gm, "")
    .replace(/\r/g, "")
    .replace(/\*\*/g, "")
    .replace(/\s+$/gm, "")
    .replace(/\n{3,}/g, "\n\n")
    .trim();
}


// Detailed Outlook 끝의 forecaster 서명/제품 링크/다음 발행 안내는 예보 본문이 아니므로 제거한다.
function trimSpcOutlookTail(value) {
  let text = cleanSevereText(value);
  if (!text) return "";

  const cutPatterns = [
    // Forecaster signature and product footer
    /\n\s*\.\.[A-Za-z][^\n]{0,140}\.\.\s*(?:\d{1,2}\/\d{1,2}\/\d{4}|\d{4})?/i,
    /\n\s*(?:CLICK\s+TO\s+GET|CLICK\s+HERE\s+TO\s+GET)\s+WUUS0[1-3]\s+PTSDY[1-3][^\n]*/i,
    /\n\s*NOTE:\s*THE\s+NEXT\s+DAY\s+[1-3]\s+OUTLOOK\s+IS\s+SCHEDULED[^\n]*/i,
    /\n\s*WUUS0[1-3]\s+PTSDY[1-3][^\n]*/i,

    // Website navigation / footer
    /\n\s*(?:Top|Latest Day\s+[1-3]\s+Outlook|Today's Outlook|Forecast Products|Home)\b/i,
    /\n\s*Weather Topics\s*:/i,
    /\n\s*(?:Watches|Mesoscale Discussions|Outlooks|Fire Weather|All Products|Contact Us)\b/i,
    /\n\s*NOAA\s*\/\s*National Weather Service/i,
    /\n\s*National Weather Service\b/i,
    /\n\s*National Centers for Environmental Prediction\b/i,
    /\n\s*Storm Prediction Center\b/i,
    /\n\s*120\s+David\s+L\.\s+Boren\s+Blvd/i,
    /\n\s*Page last modified\s*:/i,
    /\n\s*Disclaimer\b/i,
    /\n\s*Information Quality\b/i,
    /\n\s*Help\b/i,
    /\n\s*Glossary\b/i,
    /\n\s*Privacy Policy\b/i,
    /\n\s*Freedom of Information Act\b/i,
    /\n\s*About Us\b/i,
    /\n\s*Career Opportunities\b/i,

    // Ads / promotional / tracking / scripts
    /\n\s*Advertisement\b/i,
    /\n\s*Sponsored\b/i,
    /\n\s*AdChoices\b/i,
    /\n\s*Google Ads?\b/i,
    /\n\s*adsbygoogle\b/i,
    /\n\s*googlesyndication\b/i,
    /\n\s*doubleclick\b/i,
    /\n\s*if\s*\(\s*typeof\s+jQuery/i,
    /\n\s*document\.write\s*\(/i,
    /\n\s*<script\b/i
  ];

  let cutAt = text.length;
  for (const rx of cutPatterns) {
    const match = rx.exec(text);
    if (match && match.index < cutAt) cutAt = match.index;
  }

  return cleanSevereText(text.slice(0, cutAt));
}

function extractMarkdownSection(text, heading) {
  const escaped = heading.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const rx = new RegExp(`(?:^|\\n)#{2,3}\\s+${escaped}\\s*\\n([\\s\\S]*?)(?=\\n#{2,3}\\s+|$)`, "i");
  const match = text.match(rx);
  return match ? cleanSevereText(match[1]) : "";
}

// ## Detailed Outlook처럼 H2 아래에 여러 개의 ### 하위 섹션이 있는 경우,
// 다음 H2가 나올 때까지 전체를 가져온다.
function extractMarkdownH2Section(text, heading) {
  const escaped = heading.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const rx = new RegExp(`(?:^|\\n)##\\s+${escaped}\\s*\\n([\\s\\S]*?)(?=\\n##\\s+|$)`, "i");
  const match = text.match(rx);
  return match ? cleanSevereText(match[1]) : "";
}

function severeDateLabel(dateKey) {
  const d = new Date(`${dateKey}T12:00:00Z`);
  if (Number.isNaN(d.getTime())) return "";
  const weekday = ["Sunday", "Monday", "Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"][d.getUTCDay()];
  const month = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"][d.getUTCMonth()];
  return `${weekday}, ${month} ${d.getUTCDate()}`;
}

function parseRiskValue(value) {
  return cleanSevereText(value)
    .replace(/^[\s:*\-]+|[\s:*\-]+$/g, "")
    .replace(/\s+/g, " ");
}

function parseSevereWeatherMarkdown(markdown, dateKey) {
  const text = cleanSevereText(markdown);

  // 중요: Detailed Outlook은 ### 하위 제목을 포함하므로 다음 ##까지 모두 읽어야 한다.
  const detailed = extractMarkdownH2Section(text, "Detailed Outlook") || text;

  const headlineMatch = detailed.match(/(?:^|\n)#{3}\s+(THERE IS[^\n]+)/i) ||
    detailed.match(/(?:^|\n)(THERE IS (?:A|AN|NO)[^\n]+)/i) ||
    detailed.match(/(?:^|\n)#{3}\s+(NO SEVERE THUNDERSTORM AREAS FORECAST[^\n]*)/i);

  const summaryMatch = detailed.match(
    /(?:^|\n)#{3}\s+SUMMARY\s*\n([\s\S]*?)(?=\n#{3}\s+|\n\.\.|$)/i
  );

  // Synopsis/Discussion 이후의 지역별 상세 소제목(### ...)까지 모두 포함한다.
  // detailed 자체가 다음 ## 직전에서 끝나므로 여기서는 끝까지 읽어도 안전하다.
  const synopsisMatch = detailed.match(
    /(?:^|\n)#{3}\s+(?:Synopsis|Discussion)\s*\n([\s\S]*)$/i
  );

  const risk = {};

  // 1순위: 이 페이지의 Outlook Images 값만 사용한다.
  const imageSection = extractMarkdownH2Section(text, "Outlook Images");
  if (imageSection) {
    [["tornado", "tornado"], ["hail", "hail"], ["wind", "wind"]].forEach(([key, label]) => {
      const rx = new RegExp(`(?:^|\\n)#{3,4}\\s+${label}\\s+([^\\n]+)`, "i");
      const m = imageSection.match(rx);
      if (m) risk[key] = parseRiskValue(m[1]);
    });
  }

  // 2순위: Outlook Images에 값이 없을 때만 National Risk Overview에서
  // '해당 날짜' 행을 찾아 사용한다. 첫 번째 TORNADO/HAIL/WIND를 절대 집지 않는다.
  const national = extractMarkdownH2Section(text, "National Risk Overview");
  const dateLabel = severeDateLabel(dateKey);
  if (national && dateLabel && (!risk.tornado || !risk.hail || !risk.wind)) {
    const lines = national.split("\n").map(x => x.trim()).filter(Boolean);
    const dateIndex = lines.findIndex(line => line.toLowerCase().startsWith(dateLabel.toLowerCase()));
    if (dateIndex >= 0) {
      const slice = [];
      for (let i = dateIndex + 1; i < lines.length; i++) {
        if (/^(Sunday|Monday|Tuesday|Wednesday|Thursday|Friday|Saturday),\s+/i.test(lines[i])) break;
        slice.push(lines[i]);
      }
      const block = slice.join("\n");
      [["tornado", "TORNADO"], ["hail", "HAIL"], ["wind", "WIND"]].forEach(([key, label]) => {
        if (risk[key]) return;
        const m = block.match(new RegExp(`${label}:\\s*([^\\n]+)`, "i"));
        if (m) risk[key] = parseRiskValue(m[1]);
      });
    }
  }

  return {
    headline: headlineMatch ? cleanSevereText(headlineMatch[1]) : "",
    summary: summaryMatch ? cleanSevereText(summaryMatch[1]) : extractMarkdownSection(text, "Outlook Summary"),
    synopsis: synopsisMatch ? trimSpcOutlookTail(synopsisMatch[1]) : "",
    risk
  };
}


async function spcFetchTextWithRetry_(url, options = {}, maxRetries = 2) {
  let lastError = null;

  for (let attempt = 0; attempt <= maxRetries; attempt++) {
    try {
      const response = await fetch(url, { cache: "no-store", ...options });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return await response.text();
    } catch (error) {
      lastError = error;
      console.warn(
        `SPC text fetch 실패 (${attempt + 1}/${maxRetries + 1})`,
        url,
        error
      );

      if (attempt < maxRetries) {
        await new Promise(resolve => setTimeout(resolve, 500 * (attempt + 1)));
      }
    }
  }

  throw lastError || new Error("SPC text fetch 실패");
}

async function spcFetchJsonWithRetry_(url, options = {}, maxRetries = 2) {
  let lastError = null;

  for (let attempt = 0; attempt <= maxRetries; attempt++) {
    try {
      const response = await fetch(url, { cache: "no-store", ...options });
      if (!response.ok) throw new Error(`HTTP ${response.status}`);
      return await response.json();
    } catch (error) {
      lastError = error;
      console.warn(
        `SPC JSON fetch 실패 (${attempt + 1}/${maxRetries + 1})`,
        url,
        error
      );

      if (attempt < maxRetries) {
        await new Promise(resolve => setTimeout(resolve, 500 * (attempt + 1)));
      }
    }
  }

  throw lastError || new Error("SPC JSON fetch 실패");
}


function spcHtmlToStructuredText_(html) {
  const doc = new DOMParser().parseFromString(String(html || ""), "text/html");
  const root = doc.querySelector("main, article, #content, .content") || doc.body;
  if (!root) return "";

  const blockTags = new Set([
    "P", "DIV", "SECTION", "ARTICLE", "LI", "UL", "OL",
    "TABLE", "TR", "BLOCKQUOTE", "PRE"
  ]);

  function walk(node) {
    if (!node) return "";

    if (node.nodeType === Node.TEXT_NODE) {
      return String(node.nodeValue || "");
    }

    if (node.nodeType !== Node.ELEMENT_NODE) return "";

    const tag = node.tagName;

    if (/^H[1-6]$/.test(tag)) {
      const level = Math.max(2, Math.min(6, Number(tag.slice(1)) || 2));
      const content = Array.from(node.childNodes).map(walk).join("").trim();
      return content ? `\n${"#".repeat(level)} ${content}\n` : "";
    }

    if (tag === "BR") return "\n";

    // script/style/nav/footer는 상세예보 본문 구조에 필요하지 않음
    if (["SCRIPT", "STYLE", "NOSCRIPT", "NAV", "FOOTER"].includes(tag)) return "";

    const content = Array.from(node.childNodes).map(walk).join("");

    if (blockTags.has(tag)) {
      return `\n${content.trim()}\n\n`;
    }

    return content;
  }

  return walk(root)
    .replace(/[ \t]+\n/g, "\n")
    .replace(/\n[ \t]+/g, "\n")
    .replace(/\n{3,}/g, "\n\n")
    .trim();
}

async function fetchSevereWeatherPage(dateKey) {
  const cached = severeOutlookCache.get(dateKey);
  if (cached && Date.now() - cached.savedAt < SEVERE_OUTLOOK_CACHE_MS) return cached.promise;
  if (cached) severeOutlookCache.delete(dateKey);

  const pageUrl = `https://www.severeweatheroutlook.com/${dateKey}/`;
  const readerUrl = `https://r.jina.ai/https://www.severeweatheroutlook.com/${dateKey}/`;

  const promise = (async () => {
    let lastError = null;

    // 실제 페이지 HTML을 먼저 시도한다.
    // 성공하면 DOM의 문단(<p>/<div>/<br>) 구조를 살려서 빈 줄을 정확히 보존한다.
    // CORS 등으로 직접 접근이 안 되면 Jina Reader로 fallback한다.
    for (const url of [pageUrl, readerUrl]) {
      try {
        let body = await spcFetchTextWithRetry_(url, {}, 2);

        // 직접 HTML 응답이면 innerText로 평탄화하지 않는다.
        // 원문 페이지의 실제 문단/빈 줄 구조를 보존한 Markdown 유사 텍스트로 변환한다.
        if (/^\s*<!doctype html|<html[\s>]/i.test(body)) {
          body = spcHtmlToStructuredText_(body);
        }

        const parsed = parseSevereWeatherMarkdown(body, dateKey);
        if (parsed.headline || parsed.summary || parsed.synopsis || Object.keys(parsed.risk).length) {
          return { ...parsed, pageUrl };
        }
        throw new Error("상세 예보 본문을 찾지 못했습니다.");
      } catch (error) {
        lastError = error;
      }
    }

    throw lastError || new Error("Severe Weather Outlook 연결 실패");
  })();

  severeOutlookCache.set(dateKey, { savedAt: Date.now(), promise });
  try {
    return await promise;
  } catch (error) {
    severeOutlookCache.delete(dateKey);
    throw error;
  }
}

// 'High Plains'처럼 고유 지역명에 자주 붙는 끝 단어들.
// 새 지역명이 SPC 본문에 등장해도 이 패턴에 맞으면 별도 하드코딩 없이 원문을 유지한다.
const SPC_GEOGRAPHIC_SUFFIXES = [
  "Plains", "Valley", "Valleys", "Hills", "Mountains", "Mountain",
  "Plateau", "Plateaus", "Basin", "Basins", "Coast", "Coastal Plain",
  "Peninsula", "Panhandle", "Piedmont", "Foothills", "Range",
  "Northwest", "Southwest", "Northeast", "Southeast", "Midwest",
  "Appalachians", "Rockies", "Cascades", "Sierras"
];

function protectSpcEnglishTerms(text) {
  let protectedText = String(text || "");
  const replacements = [];

  function stash(value) {
    const token = `[[SPCTERM${replacements.length}]]`;
    replacements.push({ token, value });
    return token;
  }

  // 1) 기상용어 중 한국어로 반드시 자연스럽게 보여줄 표현을 먼저 보호한다.
  // 번역기로 보내기 전 토큰화하고, 번역 후 지정한 한국어 표현으로 복원한다.
  const forcedKo = [...SPC_FORCE_KOREAN_TERMS].sort((a, b) => b[0].length - a[0].length);
  forcedKo.forEach(([term, korean]) => {
    const escaped = term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const rx = new RegExp(`\\b${escaped}\\b`, "gi");
    protectedText = protectedText.replace(rx, () => stash(korean));
  });

  // 2) 명시적 고유 권역명/약어는 영어 원문 그대로 보호한다.
  const terms = [...SPC_KEEP_ENGLISH_TERMS].sort((a, b) => b.length - a.length);
  terms.forEach(term => {
    const escaped = term.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    const rx = new RegExp(`\\b${escaped}\\b`, "gi");
    protectedText = protectedText.replace(rx, match => stash(match));
  });

  // 3) 자동 지리권역명 보호.
  // 예: Central Appalachians, Edwards Plateau, Snake River Plain 같은 새로운 명칭도 보호한다.
  const suffixAlt = SPC_GEOGRAPHIC_SUFFIXES
    .map(x => x.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"))
    .sort((a, b) => b.length - a.length)
    .join("|");

  const geoRx = new RegExp(
    `\\b(?:[A-Z][A-Za-z.'-]*\\s+){0,4}(?:${suffixAlt})\\b`,
    "g"
  );
  protectedText = protectedText.replace(geoRx, match => {
    const trimmed = match.trim();
    if (!trimmed || /^SPCTERM/i.test(trimmed)) return match;
    return stash(trimmed);
  });

  // 4) CONUS, SBCAPE, MLCAPE, LLJ, MCS, WRF 같은 대문자 약어는 자동 보호한다.
  protectedText = protectedText.replace(/\\b[A-Z][A-Z0-9]{1,9}\\b/g, match => {
    if (/^SPCTERM\\d+$/i.test(match)) return match;
    return stash(match);
  });

  return { protectedText, replacements };
}

function restoreSpcEnglishTerms(text, replacements) {
  let result = String(text || "");
  replacements.forEach(({ token, value }) => {
    // 번역기가 토큰 주변에 공백을 넣는 경우까지 허용한다.
    const number = token.match(/\d+/)?.[0] || "";
    const rx = new RegExp(`\\[\\[\\s*SPCTERM\\s*${number}\\s*\\]\\]`, "gi");
    result = result.replace(rx, value);
  });
  return result;
}

async function translateSevereText(text) {
  const source = cleanSevereText(text);
  if (!source) return "";
  if (severeTranslateCache.has(source)) return severeTranslateCache.get(source);

  const promise = (async () => {
    const { protectedText, replacements } = protectSpcEnglishTerms(source);
    try {
      const url = "https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ko&dt=t&q=" +
        encodeURIComponent(protectedText);
      const response = await fetch(url, { cache: "no-store" });
      if (!response.ok) throw new Error(`번역 HTTP ${response.status}`);
      const data = await response.json();
      const translated = Array.isArray(data?.[0])
        ? data[0].map(item => Array.isArray(item) ? (item[0] || "") : "").join("")
        : "";
      let restored = restoreSpcEnglishTerms(translated.trim(), replacements);

      // 보호된 한국어 기상용어 주변에서 기계번역이 잘못 붙이는 조사를 보정한다.
      // 예: "기압골가" → "기압골이", "기압능가" → "기압능이".
      restored = restored
        .replace(/기압골가/g, "기압골이")
        .replace(/기압능가/g, "기압능이")
        .replace(/기압골은가/g, "기압골은")
        .replace(/기압능은가/g, "기압능은")
        // "ridge is/will be in place" 계열은 운항 브리핑에서 자연스럽게 "형성됩니다"로 통일한다.
        .replace(/기압능이\s*(?:배치|자리)됩니다/g, "기압능이 형성됩니다")
        .replace(/기압능이\s*(?:배치|자리)할\s*전망입니다/g, "기압능이 형성될 전망입니다");

      return spcNaturalizeKorean(restored || source);
    } catch (_) {
      return source;
    }
  })();

  severeTranslateCache.set(source, promise);
  return promise;
}

}
