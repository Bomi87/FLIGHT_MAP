<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<title>Flight Route Viewer</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>

html,body{
margin:0;
padding:0;
height:100%;
width:100%;
}

#map{
height:100vh;
width:100%;
}

.popup-body{
font-size:12px;
line-height:1.4;
}

.popup-title{
font-weight:700;
margin-bottom:4px;
}

.kml-label{
background:transparent !important;
border:none !important;
box-shadow:none !important;
}

.kml-label:before{
display:none !important;
}

.kml-label-text{

text-shadow:
-1px -1px 0 #000,
1px -1px 0 #000,
-1px 1px 0 #000,
1px 1px 0 #000;

font-weight:700;
font-size:16px;

}

</style>
</head>

<body>

<div id="map"></div>

<script>

const map = L.map('map',{
worldCopyJump:false,
preferCanvas:true
}).setView([45,180],3);

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{
maxZoom:18,
noWrap:true
}
).addTo(map);

const drawn = L.featureGroup().addTo(map);





/* -----------------------------
   영공 국가 리스트
----------------------------- */

const AIRSPACE_COUNTRIES = new Set([

"일본",
"대한민국",
"미국",
"중국",
"러시아",
"몽골",
"대만",
"필리핀",
"태국",
"베트남",
"라오스",
"캄보디아",
"인도네시아",
"말레이시아",
"싱가포르",
"브루나이",
"미얀마",
"네팔",
"방글라데시",
"인도",
"스리랑카",
"몰디브",

"캐나다",
"멕시코",
"쿠바",
"바하마",
"파나마",

"영국",
"프랑스",
"독일",
"네덜란드",
"벨기에",
"스위스",
"스페인",
"포르투갈",
"이탈리아",
"그리스",
"노르웨이",
"스웨덴",
"핀란드",
"덴마크",
"폴란드",
"체코",
"슬로바키아",
"헝가리",
"루마니아",
"불가리아",
"터키",

"이집트",
"모로코",
"알제리",
"튀니지",
"리비아",

"호주",
"뉴질랜드"

]);





function normalizeLon(lon){

while(lon<0) lon+=360;
while(lon>=360) lon-=360;

return lon;

}





function escapeHtml(str){

return String(str||"")
.replaceAll("&","&amp;")
.replaceAll("<","&lt;")
.replaceAll(">","&gt;")

}





function parseXml(text){

return new DOMParser().parseFromString(text,"text/xml");

}





function isAirspaceLabel(name){

if(!name) return false;

let country = name.split("(")[0].trim();

return AIRSPACE_COUNTRIES.has(country);

}





function buildPopup(title,desc){

let html=`<div class="popup-body">`;

if(title){

html+=`<div class="popup-title">${escapeHtml(title)}</div>`;

}

if(desc){

html+=`<div>${desc}</div>`;

}

html+=`</div>`;

return html;

}





function drawPoint(feature,index,total){

const lat=feature.lat;
const lon=normalizeLon(feature.lon);

const name=feature.name||"";

const isAirspace=isAirspaceLabel(name);



let iconColor="yellow";

if(index===0) iconColor="green";
if(index===total-1) iconColor="red";

if(isAirspace) iconColor="#ffffff";



const marker=L.circleMarker(

[lat,lon],
{
radius:5,
color:"#222",
weight:1,
fillColor:iconColor,
fillOpacity:1
}

).addTo(map);



marker.bindPopup(

buildPopup(feature.name,feature.description),
{maxWidth:360}

);



/* -----------------------------
   영공 라벨만 항상 표시
----------------------------- */

if(isAirspace){

const labelHtml=

`<span class="kml-label-text">

${escapeHtml(name)}

</span>`;


marker.bindTooltip(

labelHtml,
{
permanent:true,
direction:"right",
offset:[8,0],
className:"kml-label"
}

);

}



drawn.addLayer(marker);

}





function parseCoordinates(text){

if(!text) return [];

return text.trim().split(/\s+/).map(row=>{

let parts=row.split(",");

return{

lon:parseFloat(parts[0]),
lat:parseFloat(parts[1])

};

});

}





function drawLine(coords){

const latlngs=coords.map(c=>[c.lat,normalizeLon(c.lon)]);

const line=L.polyline(

latlngs,
{
color:"#FFD400",
weight:5
}

).addTo(map);

drawn.addLayer(line);

}





function loadKML(text){

const xml=parseXml(text);

const placemarks=[...xml.getElementsByTagName("Placemark")];

const pointFeatures=[];
const lineFeatures=[];



placemarks.forEach(pm=>{

const name=pm.getElementsByTagName("name")[0]?.textContent.trim()||"";

const desc=pm.getElementsByTagName("description")[0]?.textContent||"";



const pointNode=pm.getElementsByTagName("Point")[0];

const lineNode=pm.getElementsByTagName("LineString")[0];



if(pointNode){

let coords=parseCoordinates(

pointNode.getElementsByTagName("coordinates")[0]?.textContent

);

if(coords.length){

pointFeatures.push({

name:name,
description:desc,
lat:coords[0].lat,
lon:coords[0].lon

});

}

}



if(lineNode){

let coords=parseCoordinates(

lineNode.getElementsByTagName("coordinates")[0]?.textContent

);

if(coords.length){

lineFeatures.push(coords);

}

}

});



lineFeatures.forEach(drawLine);



pointFeatures.forEach((p,i)=>{

drawPoint(p,i,pointFeatures.length);

});



map.fitBounds(drawn.getBounds(),{padding:[20,20]});

}





async function loadFile(filename){

const res=await fetch(filename+"?v="+Date.now());

const text=await res.text();

loadKML(text);

}





function init(){

const params=new URLSearchParams(location.search);

const file=params.get("file")||"route.kml";

loadFile(file);

}



init();

</script>

</body>
</html>
