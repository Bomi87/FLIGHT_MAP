<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flight Map</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
    }

    #map {
      width: 100%;
      height: 100vh;
    }

    .info {
      position: absolute;
      top: 10px;
      left: 10px;
      z-index: 1000;
      background: rgba(255,255,255,0.95);
      padding: 8px 10px;
      border-radius: 8px;
      font-size: 13px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.18);
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <div class="info" id="info">Loading route.gpx ...</div>

  <script>
    const map = L.map('map').setView([40, 160], 3);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 18,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    const info = document.getElementById('info');

    function parseGPX(xmlText) {
      const parser = new DOMParser();
      const xml = parser.parseFromString(xmlText, "text/xml");
      const rtepts = Array.from(xml.getElementsByTagName("rtept"));

      return rtepts.map(pt => {
        const lat = parseFloat(pt.getAttribute("lat"));
        const lon = parseFloat(pt.getAttribute("lon"));
        const nameNode = pt.getElementsByTagName("name")[0];
        const name = nameNode ? nameNode.textContent : "";
        return { lat, lon, name };
      });
    }

    function normalizeLon(lon) {
      if (lon < 0) return lon + 360;
      return lon;
    }

    fetch("route.gpx?v=" + Date.now())
      .then(res => {
        if (!res.ok) throw new Error("route.gpx not found");
        return res.text();
      })
      .then(text => {
        const points = parseGPX(text);

        if (!points.length) {
          throw new Error("No rtept found in route.gpx");
        }

        const latlngs = points.map(p => [p.lat, normalizeLon(p.lon)]);

        const polyline = L.polyline(latlngs, {
          color: "blue",
          weight: 4
        }).addTo(map);

        points.forEach((p, i) => {
          const marker = L.circleMarker([p.lat, normalizeLon(p.lon)], {
            radius: 4,
            color: "#222",
            weight: 1,
            fillColor: "yellow",
            fillOpacity: 1
          }).addTo(map);

          if (i === 0 || i === points.length - 1 || i % 4 === 0) {
            marker.bindPopup((p.name || "Waypoint") + "<br>" + p.lat + ", " + p.lon);
          }
        });

        map.fitBounds(polyline.getBounds(), { padding: [20, 20] });
        info.innerHTML = "Loaded route.gpx (" + points.length + " points)";
      })
      .catch(err => {
        console.error(err);
        info.innerHTML = "Error: " + err.message;
        alert("GPX load failed: " + err.message);
      });
  </script>
</body>
</html>
