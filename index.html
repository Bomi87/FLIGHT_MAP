<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Flight Route Viewer</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
html,body{
  margin:0;
  padding:0;
  height:100%;
  width:100%;
}
#map{
  height:100vh;
  width:100%;
}
.panel{
  position:absolute;
  top:10px;
  left:10px;
  z-index:1000;
  background:rgba(255,255,255,0.95);
  padding:10px 12px;
  border-radius:8px;
  font-size:13px;
  box-shadow:0 2px 8px rgba(0,0,0,0.2);
  max-width:320px;
}
</style>
</head>

<body>

<div id="map"></div>

<div class="panel" id="status">
Loading...
</div>

<script>
const map = L.map('map').setView([42,160],3);

L.tileLayer(
  'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
  { maxZoom:18, attribution:'© OpenStreetMap' }
).addTo(map);

const status = document.getElementById("status");

function normalizeLon(lon){
  return lon < 0 ? lon + 360 : lon;
}

function getRequestedFile(){
  const params = new URLSearchParams(window.location.search);
  const file = params.get("file");
  return file ? file.trim() : "";
}

function getExtension(filename){
  const lower = filename.toLowerCase();
  if(lower.endsWith(".gpx")) return "gpx";
  if(lower.endsWith(".kml")) return "kml";
  return "";
}

function parseGPX(xmlText){
  const parser = new DOMParser();
  const xml = parser.parseFromString(xmlText, "text/xml");
  const pts = [...xml.getElementsByTagName("rtept")];

  return pts.map(p => {
    const lat = parseFloat(p.getAttribute("lat"));
    const lon = parseFloat(p.getAttribute("lon"));
    const nameNode = p.getElementsByTagName("name")[0];
    const name = nameNode ? nameNode.textContent : "";
    return { lat, lon, name };
  }).filter(p => !isNaN(p.lat) && !isNaN(p.lon));
}

function parseKML(xmlText){
  const parser = new DOMParser();
  const xml = parser.parseFromString(xmlText, "text/xml");
  const placemarks = [...xml.getElementsByTagName("Placemark")];

  const points = [];
  let lineCoords = [];

  placemarks.forEach(pm => {
    const nameNode = pm.getElementsByTagName("name")[0];
    const name = nameNode ? nameNode.textContent.trim() : "";

    const pointNode = pm.getElementsByTagName("Point")[0];
    if(pointNode){
      const coordNode = pointNode.getElementsByTagName("coordinates")[0];
      if(coordNode){
        const raw = coordNode.textContent.trim();
        const parts = raw.split(",");
        const lon = parseFloat(parts[0]);
        const lat = parseFloat(parts[1]);
        if(!isNaN(lat) && !isNaN(lon)){
          points.push({ lat, lon, name });
        }
      }
    }

    const lineNode = pm.getElementsByTagName("LineString")[0];
    if(lineNode){
      const coordNode = lineNode.getElementsByTagName("coordinates")[0];
      if(coordNode){
        const raw = coordNode.textContent.trim();
        const rows = raw.split(/\s+/);
        const parsed = rows.map(r => {
          const parts = r.split(",");
          return {
            lon: parseFloat(parts[0]),
            lat: parseFloat(parts[1]),
            name: ""
          };
        }).filter(p => !isNaN(p.lat) && !isNaN(p.lon));

        if(parsed.length > 1 && lineCoords.length === 0){
          lineCoords = parsed;
        }
      }
    }
  });

  return { points, lineCoords };
}

function drawRouteAndMarkers(points, sourceName){
  if(!points || points.length < 2){
    throw new Error("No valid route points");
  }

  const latlngs = points.map(p => [p.lat, normalizeLon(p.lon)]);

  const route = L.polyline(latlngs, {
    color:"#FFD400",
    weight:5
  }).addTo(map);

  points.forEach((p, i) => {
    const latlng = [p.lat, normalizeLon(p.lon)];
    let iconColor = "yellow";
    let popupText = p.name || "Waypoint";

    if(i === 0){
      iconColor = "green";
      popupText = "🛫 " + (p.name || "Departure");
    }

    if(i === points.length - 1){
      iconColor = "red";
      popupText = "🛬 " + (p.name || "Arrival");
    }

    const marker = L.circleMarker(latlng, {
      radius:5,
      color:"#222",
      weight:1,
      fillColor:iconColor,
      fillOpacity:1
    }).addTo(map);

    marker.bindPopup(popupText);
  });

  map.fitBounds(route.getBounds(), { padding:[20,20] });

  status.innerHTML =
    "<b>Flight Route Loaded</b><br>" +
    "File: " + sourceName + "<br>" +
    "Waypoints: " + points.length;
}

async function fetchTextFile(filename){
  const res = await fetch(filename + "?v=" + Date.now());
  if(!res.ok){
    throw new Error(filename + " not found");
  }
  return await res.text();
}

async function loadByFilename(filename){
  const ext = getExtension(filename);

  if(!ext){
    throw new Error("Only .gpx or .kml supported");
  }

  const text = await fetchTextFile(filename);

  if(ext === "gpx"){
    const points = parseGPX(text);
    drawRouteAndMarkers(points, filename);
    return;
  }

  if(ext === "kml"){
    const parsed = parseKML(text);

    if(parsed.points.length >= 2){
      drawRouteAndMarkers(parsed.points, filename);
      return;
    }

    if(parsed.lineCoords.length >= 2){
      drawRouteAndMarkers(parsed.lineCoords, filename);
      return;
    }

    throw new Error("No valid Point or LineString in KML");
  }
}

async function autoLoadDefault(){
  try{
    await loadByFilename("route.gpx");
    return;
  }catch(e1){
    try{
      await loadByFilename("route.kml");
      return;
    }catch(e2){
      throw new Error("No default route.gpx or route.kml found");
    }
  }
}

async function init(){
  try{
    const requested = getRequestedFile();

    if(requested){
      await loadByFilename(requested);
    }else{
      await autoLoadDefault();
    }
  }catch(err){
    status.innerHTML = "Error: " + err.message;
    console.error(err);
  }
}

init();
</script>

</body>
</html>
