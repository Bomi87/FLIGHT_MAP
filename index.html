<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Flight Route Viewer</title>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"/>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
html,body{
margin:0;
height:100%;
}

#map{
height:100vh;
}

.panel{
position:absolute;
top:10px;
left:10px;
background:white;
padding:10px;
border-radius:6px;
z-index:1000;
font-size:13px;
}
</style>
</head>

<body>

<div id="map"></div>
<div class="panel" id="info">Loading...</div>

<script>

const map = L.map('map').setView([40,160],3)

L.tileLayer(
'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
{maxZoom:18}
).addTo(map)

const layerGroup = L.featureGroup().addTo(map)

function getFile(){

const url = new URLSearchParams(location.search)
const file = url.get("file")

if(file) return file

return "route.gpx"
}

function normalize(lon){

while(lon>180) lon-=360
while(lon<-180) lon+=360

return lon
}

function pacific(lon){

if(lon<0) return lon+360
return lon
}

function splitLine(coords){

const segments=[]
let current=[coords[0]]

for(let i=1;i<coords.length;i++){

let p1=coords[i-1]
let p2=coords[i]

let diff=Math.abs(p2[1]-p1[1])

if(diff>180){

segments.push(current)
current=[p2]

}else{

current.push(p2)

}

}

segments.push(current)

return segments
}

async function loadFile(name){

const res=await fetch(name+"?v="+Date.now())

if(!res.ok) throw "file not found"

return await res.text()
}

function parseXML(text){

return new DOMParser().parseFromString(text,"text/xml")

}

function drawWaypoint(lat,lon,name,i,total){

let color="yellow"

if(i==0) color="green"
if(i==total-1) color="red"

const m=L.circleMarker(
[lat,pacific(lon)],
{
radius:5,
color:"#222",
weight:1,
fillColor:color,
fillOpacity:1
}
).addTo(map)

if(name) m.bindPopup(name)

layerGroup.addLayer(m)
}

function drawRoute(coords){

const latlngs=coords.map(c=>[c.lat,pacific(c.lon)])

const seg=splitLine(latlngs)

seg.forEach(s=>{

const line=L.polyline(
s,
{
color:"#FFD400",
weight:5
}
).addTo(map)

layerGroup.addLayer(line)

})

}

function parseGPX(text){

const xml=parseXML(text)

const pts=[...xml.getElementsByTagName("rtept")]

const arr=[]

pts.forEach(p=>{

arr.push({
lat:parseFloat(p.getAttribute("lat")),
lon:parseFloat(p.getAttribute("lon")),
name:p.getElementsByTagName("name")[0]?.textContent||""
})

})

return arr
}

function parseKML(text){

const xml=parseXML(text)

const points=[]
const lines=[]
const polys=[]

const placemarks=[...xml.getElementsByTagName("Placemark")]

placemarks.forEach(p=>{

const name=p.getElementsByTagName("name")[0]?.textContent||""

const point=p.getElementsByTagName("Point")[0]

if(point){

const c=point.getElementsByTagName("coordinates")[0].textContent.trim()

const parts=c.split(",")

points.push({
lat:parseFloat(parts[1]),
lon:parseFloat(parts[0]),
name
})

}

const line=p.getElementsByTagName("LineString")[0]

if(line){

const raw=line.getElementsByTagName("coordinates")[0].textContent.trim()

const rows=raw.split(/\s+/)

const coords=[]

rows.forEach(r=>{

const s=r.split(",")

coords.push({
lat:parseFloat(s[1]),
lon:parseFloat(s[0])
})

})

if(coords.length>10){
lines.push(coords)
}

}

const poly=p.getElementsByTagName("Polygon")[0]

if(poly){

const raw=poly.getElementsByTagName("coordinates")[0].textContent.trim()

const rows=raw.split(/\s+/)

const coords=[]

rows.forEach(r=>{

const s=r.split(",")

coords.push([
parseFloat(s[1]),
normalize(parseFloat(s[0]))
])

})

polys.push(coords)

}

})

return {points,lines,polys}

}

function drawPolygon(coords){

const p=L.polygon(
coords,
{
color:"#00aa55",
weight:2,
fillOpacity:0.3
}
).addTo(map)

layerGroup.addLayer(p)

}

async function init(){

try{

const file=getFile()

const text=await loadFile(file)

if(file.endsWith(".gpx")){

const pts=parseGPX(text)

drawRoute(pts)

pts.forEach((p,i)=>drawWaypoint(p.lat,p.lon,p.name,i,pts.length))

}

if(file.endsWith(".kml")){

const data=parseKML(text)

data.lines.forEach(l=>drawRoute(l))

data.polys.forEach(p=>drawPolygon(p))

data.points.forEach((p,i)=>drawWaypoint(p.lat,p.lon,p.name,i,data.points.length))

}

map.fitBounds(layerGroup.getBounds())

document.getElementById("info").innerHTML=file

}catch(e){

document.getElementById("info").innerHTML=e

}

}

init()

</script>

</body>
</html>
